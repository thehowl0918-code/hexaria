<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEXARIA 헥사리아 — 프로토타입</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AC%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe4df; --surface:#f4f6f2; --surface-2:#e6ebe5; --text:#18232a; --muted:#5d6b70; --line:#c3ccc5;
  --brass:#9a6b1c; --brass-ink:#ffffff; --danger:#b23a32; --ok:#2c7a52;
  --tile-vis:#cfd8cf; --tile-exp:#a9b4ab; --tile-unk:#7d8a83; --tile-edge:#eef2ec;
  --center:#b8861f; --hl:#1b6f86; --table:#c8d1ca;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181c; --surface:#18222a; --surface-2:#212d35; --text:#e3e8e4; --muted:#8e9ca0; --line:#2b3942;
    --brass:#d9a441; --brass-ink:#1a1306; --danger:#e8685e; --ok:#5cc28e;
    --tile-vis:#3a4b52; --tile-exp:#27343b; --tile-unk:#121a1f; --tile-edge:#0b1114;
    --center:#e6b44c; --hl:#5fc6dc; --table:#1a252c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181c; --surface:#18222a; --surface-2:#212d35; --text:#e3e8e4; --muted:#8e9ca0; --line:#2b3942;
  --brass:#d9a441; --brass-ink:#1a1306; --danger:#e8685e; --ok:#5cc28e;
  --tile-vis:#3a4b52; --tile-exp:#27343b; --tile-unk:#121a1f; --tile-edge:#0b1114;
  --center:#e6b44c; --hl:#5fc6dc; --table:#1a252c;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55}
button{font:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.wordmark{font-family:'Cinzel','Times New Roman',serif;font-weight:800;letter-spacing:.08em}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:8px;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--brass)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.active{outline:2px solid var(--hl);outline-offset:1px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.tag.wip{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.tag.temp{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:6px}

/* 메인 */
.menu{min-height:100vh;display:grid;place-items:center;padding:24px}
.menu-inner{text-align:center;max-width:520px}
.menu h1{font-size:clamp(44px,9vw,76px);margin:8px 0 0;line-height:1}
.menu .sub{color:var(--muted);margin:10px 0 30px}
.menu-btns{display:grid;gap:10px;max-width:280px;margin:0 auto}
.menu-btns .btn{padding:13px}
.menu .note{margin-top:28px;font-size:13px;color:var(--muted)}

/* 일반 페이지 */
.page{max-width:980px;margin:0 auto;padding:24px 18px 60px}
.page h2{font-size:24px;margin:0 0 4px}
.page h3{font-size:17px;margin:26px 0 8px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
ul.plain{margin:6px 0;padding-left:20px}
.seat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seat input,.seat select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);min-width:0}

/* 문명 선택 */
.civ-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.civ-card{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--text)}
.civ-card.sel{border-color:var(--brass)}
.civ-card .sym{font-size:28px;line-height:1}
.civ-card h4{margin:8px 0 2px;font-size:20px}
.civ-card .theme{color:var(--brass);font-weight:700;font-size:13px}

/* 게임 레이아웃 */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.topbar .wordmark{font-size:20px}
.topbar .spacer{flex:1}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;padding:14px;max-width:1520px;margin:0 auto}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
.board-wrap{position:relative;background:var(--table);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center}
.hud{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 6px 8px;font-size:13.5px}
.hud .spacer{flex:1}
.hud .sl{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sl.empty{color:var(--muted)}
.hud .pts{font-weight:700}
.pop{position:absolute;z-index:6;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:9px 10px;width:max-content;max-width:min(300px,92%);font-size:13.5px;visibility:hidden}
.pop .t{font-weight:700;margin-bottom:2px}
.pop .s{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.pop .btns{display:flex;flex-wrap:wrap;gap:5px}
.pop .btn{padding:6px 10px;font-size:13px}
.atk-mark{fill:var(--danger);fill-opacity:.42;stroke:var(--danger);stroke-width:2.2}
svg.board{width:100%;height:auto;max-height:calc(100vh - 120px);display:block;touch-action:manipulation}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.panel h4{margin:0 0 8px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.row + .row{border-top:1px dashed var(--line)}
.slots{display:grid;gap:6px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-height:40px}
.slot .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:12px;font-weight:700;flex:none}
.slot .txt{flex:1;font-size:13.5px}
.slot.empty .txt{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions .btn{text-align:left;padding:8px 10px;font-size:13.5px}
.hint{font-size:13px;color:var(--muted);margin:9px 0 0;min-height:1.4em}
.hint.warn{color:var(--danger)}
.unit-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;cursor:pointer;width:100%;background:none;border:0;color:var(--text);text-align:left}
.unit-row:hover{background:var(--surface-2)}
.unit-row.sel{background:color-mix(in srgb,var(--hl) 16%,transparent)}
.chip{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.log{max-height:230px;overflow:auto;font-size:12.5px}
.log div{padding:3px 0;border-bottom:1px solid var(--line)}
.effect{border-left:3px solid var(--center);padding-left:10px}
.scroll-list{max-height:240px;overflow:auto}
.banner{background:color-mix(in srgb,var(--hl) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--hl) 40%,transparent);border-radius:10px;padding:10px 12px;font-size:14px}
.banner.err{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);width:100%;resize:vertical;word-break:break-all}
.code{font-family:'Cinzel','Times New Roman',serif;font-size:44px;font-weight:800;letter-spacing:.18em;line-height:1.1}
.field{display:grid;gap:4px;margin:10px 0}
.field input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.two{grid-template-columns:1fr}}

/* 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(8,12,14,.55);display:grid;place-items:center;padding:20px;z-index:50}
.overlay.opaque{background:var(--bg)}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.ov-card h3{margin:0 0 10px;font-size:20px}
.ov-card .btn{margin-top:16px;width:100%}

/* 보드 SVG */
.tile{cursor:pointer}
.tile .base{fill:var(--tile-vis);stroke:var(--tile-edge);stroke-width:1.4}
.tile.exp .base{fill:var(--tile-exp)}
.tile.unk .base{fill:var(--tile-unk)}
.tile:hover .base{filter:brightness(1.12)}
.ov{pointer-events:none}
.center-mark{fill:var(--center);fill-opacity:.25;stroke:var(--center);stroke-width:2.6}
.hl-mark{fill:var(--hl);fill-opacity:.38;stroke:var(--hl);stroke-width:2}
.vr-mark{fill:none;stroke:var(--hl);stroke-width:1.6;stroke-dasharray:3 2}
.sel-mark{fill:none;stroke:var(--brass);stroke-width:3}
.unit-label{font:700 11px 'IBM Plex Sans KR',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
@media (prefers-reduced-motion: no-preference){
  .hl-mark{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{fill-opacity:.2}}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ==========================================================================
   HEXARIA — 기본 시스템 프로토타입 v3
   구조
   [DATA]  CONFIG · CIVS · UNITS · BUILDINGS · ACTIONS · CENTER_EFFECTS · UNIMPLEMENTED · TEMP_RULES
   [CORE]  Hex(좌표·거리) · Board · Hooks(수치 수정 훅) · Game(조회 헬퍼) · Log
   [RULES] Rules · Purchase · Vision · CenterZone · Plan · Combat · Collision · ActionHandlers · Resolver · AI · Setup
   [NET]   WebRTC P2P (PeerJS 방 코드 / 코드 직접 교환) · 호스트가 규칙 처리
   [FLOW]  Flow(한 기기 진행)
   [UI]    view* 함수 · boardSVG · Handlers · render
   규칙 코드는 UI를 참조하지 않으며, UI는 규칙 모듈의 함수만 호출한다.
   ========================================================================== */

/* =============================== [DATA] =============================== */
const CONFIG = {
  boardRadius: 10,              // N = 1 + 3r(r+1) = 331
  playerCount: 4,
  startPoints: 15,
  actionsPerTurn: 3,
  baseVision: 1,
  scoutVision: 3,
  scoutDuration: 1,             // 정찰 지역 유지 턴 수 (정찰한 다음 턴이 끝날 때까지)
  buildRange: 1,                // 건설은 기물 바로 옆 칸에만
  baseIncome: { every: 2, amount: 1 },   // 탈락하지 않은 모든 플레이어가 2턴마다 받는 기본 포인트
  resourceMode: 'random',       // 'random' = 완전 무작위, 'symmetric' = 4명에게 대칭
  resourceCount: 8,
  resourcePairs: 2,             // symmetric 모드의 묶음 수 (한 묶음 = 4칸)
  buildTurns: 2,                // 건설을 시작한 턴 뒤로 기술병이 움직이지 않아야 하는 턴 수
  startZone: { corners: [[0,-10],[10,-10],[0,10],[-10,10]], radius: 4 },
  centerTiles: [[0,0],[1,0]],
  uniqueCivs: false,
  // 한 슬롯 안에서 행동 종류를 처리하는 순서 (플레이어 간 순서가 아님)
  // 공격은 같은 슬롯의 이동보다 먼저, 슬롯 시작 위치 기준으로 판정 (임시)
  resolveOrder: ['attack','move','scout','build','upgrade','recruit','defend'],
  temp: {
    defaultMoveRange: 1,        // 이동력이 정해지지 않은 기물 → 1칸
    allowPartialSubmit: true,
    buildOnCenter: false        // 중앙 특별 구역에는 건설 불가
  },
  net: {
    peerPrefix: 'hexaria-v3-',
    peerjsUrl: 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    iceServers: [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}],
    chunk: 12000
  }
};

const AI_LEVELS = { easy:'쉬움', normal:'보통', hard:'어려움' };
const PLAYER_COLORS = ['#c9433b','#3a74c9','#2a9466','#c98b1f'];

const CIVS = {
  tek:   { id:'tek',   name:'텍',   sym:'⚙', theme:'기술 중심', traits:['초반보다 후반 성장에 유리','연구와 기술 발전에 특화'], abilities:null, hooks:null },
  part:  { id:'part',  name:'파트', sym:'⚔', theme:'공격 중심', traits:['초반 전투에 강점','공격적인 운영에 특화'], abilities:null, hooks:null },
  ram:   { id:'ram',   name:'람',   sym:'⚖', theme:'균형 중심', traits:['특정 분야에 치우치지 않음','안정적인 성능'], abilities:null, hooks:null },
  bello: { id:'bello', name:'벨로', sym:'➶', theme:'속도 중심', traits:['기동력과 정찰에 특화','빠른 이동과 기습에 강점'], abilities:null, hooks:null }
};

// 기물: stats 값 null = 미정. temp 에 적힌 능력치는 임시값.
const STAT_LABELS = { hp:'체력', atk:'공격력', move:'이동력', range:'공격 범위', vision:'시야' };
const UNITS = {
  infantry:   { id:'infantry',   name:'보병',   short:'보', cost:1, stats:{hp:3,atk:2,def:null,move:null,range:1}, temp:['hp'], abilities:[], hooks:null },
  cavalry:    { id:'cavalry',    name:'기병',   short:'기', cost:3, stats:{hp:3,atk:null,def:null,move:3,range:null}, temp:['hp'],
                moveStyle:'charge', chargeDamage:2,
                abilities:['돌격: 한 방향 직선으로 최대 3칸 이동. 길에 있는 상대 기물을 뚫고 지나가며 피해를 준다. 상대 건물에 부딪히면 그 앞에서 멈추고 건물에 피해를 준다.'], hooks:null },
  technician: { id:'technician', name:'기술병', short:'술', cost:5, stats:{hp:2,atk:null,def:null,move:null,range:null}, temp:['hp'], canBuild:true,
                abilities:['건설: 바로 옆 칸에 건물을 짓기 시작한다. 시작한 턴 뒤 2턴이 끝날 때까지 움직이지 않아야 완공된다.'], hooks:null },
  guardian:   { id:'guardian',   name:'수호병', short:'수', cost:2, stats:{hp:5,atk:1,def:null,move:null,range:1}, temp:['hp'], abilities:[], hooks:null },
  // ---- 문명 전용 특수 기물: 살 수 없고, 문명 전용 건물 옆의 보병을 강화해서만 얻는다. 수치는 모두 임시 ----
  artillery:  { id:'artillery',  name:'포격기',   short:'포', cost:5, purchasable:false, upgradeFrom:'infantry', upgradeCost:4, requires:'workshop', civ:'tek',   stats:{hp:2,atk:2,def:null,move:null,range:3}, temp:['hp','atk','range'],
                abilities:['원거리 포격: 3칸 안의 보이는 상대를 공격한다.'], hooks:null },
  berserker:  { id:'berserker',  name:'광전사',   short:'광', cost:3, purchasable:false, upgradeFrom:'infantry', upgradeCost:2, requires:'arena', civ:'part',  stats:{hp:4,atk:3,def:null,move:null,range:1}, temp:['hp','atk'],
                abilities:['강타: 1칸 안의 상대에게 피해 3.'], hooks:null },
  vanguard:   { id:'vanguard',   name:'정예병',   short:'정', cost:3, purchasable:false, upgradeFrom:'infantry', upgradeCost:2, requires:'barracks', civ:'ram',   stats:{hp:4,atk:2,def:null,move:2,range:1}, temp:['hp','atk','move'],
                abilities:['만능: 2칸 이동, 1칸 공격 피해 2. 공사도 할 수 있다.'], canBuild:true, hooks:null },
  ranger:     { id:'ranger',     name:'척후병',   short:'척', cost:2, purchasable:false, upgradeFrom:'infantry', upgradeCost:1, requires:'outpost', civ:'bello', stats:{hp:2,atk:1,def:null,move:2,range:1,vision:2}, temp:['hp','atk','move','vision'],
                abilities:['기민함: 2칸 이동, 기본 시야 2칸.'], hooks:null }
};

// 건물: 모든 건물은 칸을 막는다(기물이 지나가거나 멈출 수 없음). 내구도가 0이 되면 파괴.
const BUILDINGS = {
  // 본진: 게임 시작 때 각자 시작 영역에 하나 놓는다. 파괴되면 탈락. 건설 불가.
  hq:    { id:'hq',    name:'본진', short:'본', cost:0, durability:15, vision:1, buildable:false, summon:true, desc:'파괴되면 그 플레이어는 탈락한다. 마지막까지 본진이 남은 플레이어가 승리.' },
  tower: { id:'tower', name:'망루', short:'망', cost:2, durability:4, vision:2, desc:'주변 2칸을 볼 수 있다.' },

/* =============================== [CORE] =============================== */
const Hex = {
  DIRS: [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]],
  key: (q,r) => q + ',' + r,
  parse: k => k.split(',').map(Number),
  dist(a,b){ const dq=a[0]-b[0], dr=a[1]-b[1]; return Math.max(Math.abs(dq),Math.abs(dr),Math.abs(dq+dr)); },
  range(c,n){ const out=[]; for(let dq=-n;dq<=n;dq++){ for(let dr=Math.max(-n,-dq-n);dr<=Math.min(n,-dq+n);dr++) out.push([c[0]+dq,c[1]+dr]); } return out; },
  neighbors(c){ return this.DIRS.map(d=>[c[0]+d[0],c[1]+d[1]]); },
  toPixel(q,r,size){ return [size*Math.sqrt(3)*(q+r/2), size*1.5*r]; },
  polygon(x,y,size){ const p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); p.push((x+size*Math.cos(a)).toFixed(2)+','+(y+size*Math.sin(a)).toFixed(2)); } return p.join(' '); },
  fmt(c){ return `${c[0]},${c[1]}`; }
};

const Board = {
  create(radius){
    const tiles=new Map();
    for(const [q,r] of Hex.range([0,0],radius)) tiles.set(Hex.key(q,r),{q,r,key:Hex.key(q,r),zoneOwner:null,center:false});
    CONFIG.startZone.corners.forEach((c,pid)=>{
      for(const [q,r] of Hex.range(c,CONFIG.startZone.radius)){ const t=tiles.get(Hex.key(q,r)); if(t) t.zoneOwner=pid; }
    });
    for(const [q,r] of CONFIG.centerTiles){ const t=tiles.get(Hex.key(q,r)); if(t) t.center=true; }
    return {radius,tiles};
  },
  // 4명에게 대칭인 자원 칸: 좌우 반전 M(q,r)=(-q-r,r)과 점대칭 P(q,r)=(-q,-r)으로 한 칸을 4칸으로 늘린다
  rollRandomResources(b,count){
    const all=[...b.tiles.values()].filter(t=>t.zoneOwner==null && !t.center && Hex.dist([t.q,t.r],[0,0])>=2).map(t=>t.key);
    const out=[];
    for(let tries=0; out.length<count && tries<2000; tries++){
      const k=all[Math.floor(Math.random()*all.length)];
      if(out.includes(k) || out.some(x=>Hex.dist(Hex.parse(x),Hex.parse(k))<3)) continue;
      out.push(k);
    }
    return out;
  },
  rollResources(b,pairs){
    const orbit=([q,r])=>[[q,r],[-q-r,r],[-q,-r],[q+r,-r]];
    const out=new Set();
    for(let tries=0; out.size<pairs*4 && tries<500; tries++){
      const [q,r]=Hex.range([0,0],b.radius-1)[Math.floor(Math.random()*Hex.range([0,0],b.radius-1).length)];
      const d=Hex.dist([q,r],[0,0]);
      if(d<3 || d>8 || r===0 || r===-2*q) continue;
      const o=orbit([q,r]).map(c=>Hex.key(c[0],c[1]));
      if(o.some(k=>{ const t=b.tiles.get(k); return !t || t.zoneOwner!=null || t.center || out.has(k) || [...out].some(x=>Hex.dist(Hex.parse(x),Hex.parse(k))<2); })) continue;
      o.forEach(k=>out.add(k));
    }
    return [...out];
  },
  zoneTiles(b,pid){ return [...b.tiles.values()].filter(t=>t.zoneOwner===pid).map(t=>t.key); }
};

const Hooks = {
  apply(name,g,unit,base){
    let v=base;
    const civ=CIVS[g.players[unit.owner].civ];
    if(civ && civ.hooks && civ.hooks[name]) v=civ.hooks[name](g,unit,v);
    const ut=UNITS[unit.type];
    if(ut.hooks && ut.hooks[name]) v=ut.hooks[name](g,unit,v);
    const ce=g.centerEffect;
    if(ce && ce.hooks && ce.hooks[name]) v=ce.hooks[name](g,unit,v,CenterZone.ctx(g,unit.owner));
    return v;
  }
};

const Game = {
  unit:(g,id)=>g.units.find(u=>u.alive&&u.id===id),
  unitsOf:(g,pid)=>g.units.filter(u=>u.alive&&u.owner===pid),
  unitAt:(g,k)=>g.units.find(u=>u.alive&&Hex.key(u.q,u.r)===k),
  buildingAt:(g,k)=>(g.buildings||[]).find(b=>Hex.key(b.q,b.r)===k),
  buildingsOf:(g,pid)=>(g.buildings||[]).filter(b=>b.owner===pid),
  siteOf:(g,unitId)=>(g.buildings||[]).find(b=>b.done===false && b.techId===unitId),
  humans:g=>g.players.filter(p=>p.type==='human'),
  newUnit(g,owner,type,q,r){ const u={id:g.nextUnitId++,owner,type,q,r,hp:Rules.maxHp({type}),alive:true}; g.units.push(u); return u; }
};

const Log = {
  add(g,e){ g.log.push(Object.assign({turn:g.turn,slot:null,pid:null,pub:null,priv:null},e)); },
  textFor(e,viewer){ return (e.pid===viewer && e.priv) ? e.priv : e.pub; }
};

/* =============================== [RULES] ============================== */
const Rules = {
  maxHp(u){ const v=UNITS[u.type].stats.hp; return v==null?1:v; },
  moveRange(g,u){ const s=UNITS[u.type].stats.move; return Hooks.apply('moveRange',g,u, s==null ? CONFIG.temp.defaultMoveRange : s); },
  isCharge(u){ return UNITS[u.type].moveStyle==='charge'; },
  attackDamage(g,u){ const v=UNITS[u.type].stats.atk; return v ? Hooks.apply('attack',g,u,v) : 0; },
  attackRange(g,u){ const v=UNITS[u.type].stats.range; return v ? Hooks.apply('attackRange',g,u,v) : 0; },
  canBuild(u){ return !!UNITS[u.type].canBuild; },
  canAttack(u){ return !UNITS[u.type].moveStyle && !!UNITS[u.type].stats.atk; },
  chargeDamage(g,u){ return Hooks.apply('chargeDamage',g,u, UNITS[u.type].chargeDamage||0); },
  visionRange(g,u){ const v=UNITS[u.type].stats.vision; return Hooks.apply('vision',g,u, v==null?CONFIG.baseVision:v); },
  unitsFor(civ){ return Object.values(UNITS).filter(u=>u.purchasable!==false && (!u.civ || u.civ===civ)); },
  buildable(civ){ return Object.values(BUILDINGS).filter(b=>b.buildable!==false && (!b.civ || b.civ===civ)); },
  specialOf(civ){ return Object.values(UNITS).find(u=>u.civ===civ && u.upgradeFrom); },
  scoutRange(g,u){ return u ? Hooks.apply('scoutRange',g,u,CONFIG.scoutVision) : CONFIG.scoutVision; },
  dirBetween(a,b){ const d=Hex.dist(a,b); if(!d) return null; const dq=(b[0]-a[0])/d, dr=(b[1]-a[1])/d; return Hex.DIRS.find(x=>x[0]===dq&&x[1]===dr)||null; },
  canBuildTile(g,k,type){ const t=g.board.tiles.get(k); if(!t || (!CONFIG.temp.buildOnCenter && t.center)) return false;
    const res=(g.resources||[]).includes(k), B=BUILDINGS[type]; if(!B) return !res; return B.onResource ? res : !res; },
  incomeOf(g,pid){ return Game.buildingsOf(g,pid).filter(b=>b.done!==false).reduce((s,b)=>s+(BUILDINGS[b.type].income||0),0); },
};

const Purchase = {
  buy(p,type){ const c=UNITS[type].cost; if(p.points<c) return false; p.points-=c; p.reserve[type]=(p.reserve[type]||0)+1; return true; },
  sellReserve(p,type){ if(!p.reserve[type]) return false; p.reserve[type]--; p.points+=UNITS[type].cost; return true; },
  reserveCount(p){ return Object.values(p.reserve).reduce((a,b)=>a+b,0); },
  canPlaceAt(g,pid,k){ const t=g.board.tiles.get(k); return !!t && t.zoneOwner===pid && !Game.unitAt(g,k) && !Game.buildingAt(g,k); },
  hqOf(g,pid){ return (g.buildings||[]).find(b=>b.owner===pid && b.type==='hq'); },
  placeHQ(g,pid,k){
    if(!this.canPlaceAt(g,pid,k)) return null;
    const old=this.hqOf(g,pid), [q,r]=Hex.parse(k);
    if(old){ old.q=q; old.r=r; return old; }
    const B=BUILDINGS.hq, b={id:g.nextBuildingId++,owner:pid,type:'hq',q,r,dur:B.durability,max:B.durability};
    g.buildings.push(b); return b;
  },
  autoHQ(g,pid){
    if(this.hqOf(g,pid)) return;
    const c=CONFIG.startZone.corners[pid];
    const free=Board.zoneTiles(g.board,pid).filter(k=>this.canPlaceAt(g,pid,k)).sort((a,b)=>Hex.dist(Hex.parse(a),c)-Hex.dist(Hex.parse(b),c));
    if(free.length) this.placeHQ(g,pid,free[Math.min(free.length-1,Math.floor(Math.random()*3))]);
  },
  place(g,pid,type,k){
    const p=g.players[pid];
    if(!p.reserve[type] || !this.canPlaceAt(g,pid,k)) return null;
    p.reserve[type]--;
    const [q,r]=Hex.parse(k);
    return Game.newUnit(g,pid,type,q,r);
  },
  relocate(g,u,k){ if(!this.canPlaceAt(g,u.owner,k)) return false; [u.q,u.r]=Hex.parse(k); return true; },
  unplace(g,u){ g.units.splice(g.units.indexOf(u),1); const p=g.players[u.owner]; p.reserve[u.type]=(p.reserve[u.type]||0)+1; },
  sellUnit(g,u){ g.units.splice(g.units.indexOf(u),1); g.players[u.owner].points+=UNITS[u.type].cost; },
  autoPlace(g,pid){
    this.autoHQ(g,pid);
    const p=g.players[pid];
    const free=shuffle(Board.zoneTiles(g.board,pid).filter(k=>!Game.unitAt(g,k)));
    for(const type of Object.keys(p.reserve)) while(p.reserve[type]>0 && free.length) this.place(g,pid,type,free.pop());
  }
};

const Vision = {
  visibleSet(g,pid){
    const s=new Set();
    const addRange=(c,n)=>{ for(const [q,r] of Hex.range(c,n)){ const k=Hex.key(q,r); if(g.board.tiles.has(k)) s.add(k); } };
    for(const u of Game.unitsOf(g,pid)) addRange([u.q,u.r],Rules.visionRange(g,u));
    for(const b of Game.buildingsOf(g,pid)) addRange([b.q,b.r], b.done===false ? 0 : (BUILDINGS[b.type].vision||0));
    for(const sc of this.activeScouts(g,pid)) for(const k of this.scoutTiles(g,sc)) s.add(k);
    return s;
  },
  activeScouts(g,pid){ return (g.scouts||[]).filter(sc=>sc.pid===pid && sc.until>=g.turn); },
  scoutTiles(g,sc){ return Hex.range([sc.q,sc.r],sc.radius).map(([q,r])=>Hex.key(q,r)).filter(k=>g.board.tiles.has(k)); },
  update(g){ for(const p of g.players){ p.visible=this.visibleSet(g,p.id); p.visible.forEach(k=>p.explored.add(k)); } }
};

const CenterZone = {
  keys(){ return CONFIG.centerTiles.map(([q,r])=>Hex.key(q,r)); },
  roll(g){ g.centerEffect=CENTER_EFFECTS[Math.floor(Math.random()*CENTER_EFFECTS.length)]; },
  occupiedTiles(g,pid){ return this.keys().filter(k=>{ const u=Game.unitAt(g,k); return u && u.owner===pid; }); },
  isActiveFor(g,pid){ return this.occupiedTiles(g,pid).length>0; },
  ctx(g,pid){ return { mine:this.isActiveFor(g,pid), other:g.players.some(p=>p.id!==pid && !p.eliminated && this.isActiveFor(g,p.id)) }; },
  // 턴 끝 효과 (포인트, 회복)
  endTurn(g){
    const ce=g.centerEffect; if(!ce) return;
    for(const p of g.players){
      if(p.eliminated || !this.isActiveFor(g,p.id)) continue;
      if(ce.income){ p.points+=ce.income; Log.add(g,{slot:null,pid:p.id,priv:`${ce.name}: 중앙 점령으로 포인트 +${ce.income} (보유 ${p.points}점)`}); }
      if(ce.heal){ let n=0; Game.unitsOf(g,p.id).forEach(u=>{ const m=Rules.maxHp(u); if(u.hp<m){ u.hp=Math.min(m,u.hp+ce.heal); n++; } });
        if(n) Log.add(g,{slot:null,pid:p.id,priv:`${ce.name}: 기물 ${n}개 체력 ${ce.heal} 회복`}); }
    }
  },
  update(g,slot){
    for(const p of g.players){
      const now=this.isActiveFor(g,p.id);
      if(now!==p.centerActive){
        Log.add(g,{slot,pid:p.id,priv: now ? `중앙 특별 구역 점령 — ${g.centerEffect.name} 효과 적용 시작` : '중앙 특별 구역에서 벗어남 — 효과 적용 종료'});
        p.centerActive=now;
      }
    }
  }
};

// 계획 단계: 플레이어가 아는 정보(자기 시야)만으로 고를 수 있는 칸을 계산
const Plan = {
  positions(g,pid,plan){
    const m=new Map(); Game.unitsOf(g,pid).forEach(u=>m.set(u.id,[u.q,u.r]));
    for(const a of plan) if(a && a.type==='move' && m.has(a.unitId)) m.set(a.unitId,a.to);
    return m;
  },
  plannedBuildTiles(plan){ return new Set(plan.filter(a=>a&&(a.type==='build'||a.type==='recruit')).map(a=>Hex.key(a.at[0],a.at[1]))); },
  plannedCost(plan){ return plan.reduce((s,a)=>s+(!a?0:a.type==='build'?BUILDINGS[a.building].cost:a.type==='upgrade'?UNITS[a.into].upgradeCost:a.type==='recruit'?UNITS[a.unit].cost:0),0); },
  canRecruitFrom(g,pid,plan,bid){
    const b=(g.buildings||[]).find(x=>x.id===bid);
    return !!b && b.owner===pid && b.done!==false && !!BUILDINGS[b.type].summon && !plan.some(a=>a&&a.type==='recruit'&&a.buildingId===bid);
  },
  recruitTargets(g,pid,plan,bid){
    if(!this.canRecruitFrom(g,pid,plan,bid)) return [];
    const b=g.buildings.find(x=>x.id===bid), pos=this.positions(g,pid,plan);
    const own=new Set(); pos.forEach(p=>own.add(Hex.key(p[0],p[1])));
    const pb=this.plannedBuildTiles(plan);
    return Hex.neighbors([b.q,b.r]).map(([q,r])=>Hex.key(q,r))
      .filter(k=>g.board.tiles.has(k) && !own.has(k) && !pb.has(k) && !this.knownBuildingAt(g,pid,k) && !this.knownEnemyAt(g,pid,k));
  },
  // 강화: 계획상 위치에서 완공된 자기 문명 전용 건물 바로 옆에 있는 보병
  upgradeInfo(g,pid,plan,unitId){
    const u=Game.unit(g,unitId), p=g.players[pid]; if(!u || u.owner!==pid) return null;
    const S=Rules.specialOf(p.civ); if(!S || u.type!==S.upgradeFrom) return null;
    if(plan.some(a=>a&&a.type==='upgrade'&&a.unitId===unitId)) return null;
    const at=this.positions(g,pid,plan).get(unitId);
    const b=Game.buildingsOf(g,pid).find(b=>b.type===S.requires && b.done!==false && Hex.dist([b.q,b.r],at)<=1);
    if(!b) return null;
    return {into:S.id,cost:S.upgradeCost,affordable:p.points-this.plannedCost(plan)>=S.upgradeCost};
  },
  knownBuildingAt(g,pid,k){ const b=Game.buildingAt(g,k); return b && (b.owner===pid || g.players[pid].visible.has(k)) ? b : null; },
  knownEnemyAt(g,pid,k){ const u=Game.unitAt(g,k); return u && u.owner!==pid && g.players[pid].visible.has(k) ? u : null; },
  moveTargets(g,pid,plan,unitId){
    const u=Game.unit(g,unitId); if(!u) return [];
    const pos=this.positions(g,pid,plan), from=pos.get(unitId);
    const own=new Set(); pos.forEach((p,id)=>{ if(id!==unitId) own.add(Hex.key(p[0],p[1])); });
    const pb=this.plannedBuildTiles(plan);
    const blocked=k=>!!this.knownBuildingAt(g,pid,k) || pb.has(k);
    const range=Rules.moveRange(g,u), out=[];
    if(Rules.isCharge(u)){
      for(const d of Hex.DIRS){
        for(let i=1;i<=range;i++){
          const k=Hex.key(from[0]+d[0]*i, from[1]+d[1]*i);
          if(!g.board.tiles.has(k) || blocked(k)) break;
          if(own.has(k) || this.knownEnemyAt(g,pid,k)) continue;   // 지나갈 수는 있지만 멈출 수는 없음
          out.push(k);
        }
      }
      return out;
    }
    return Hex.range(from,range).map(([q,r])=>Hex.key(q,r))
      .filter(k=>g.board.tiles.has(k) && k!==Hex.key(from[0],from[1]) && !own.has(k) && !blocked(k) && !this.knownEnemyAt(g,pid,k));
  },
  // 돌격 미리보기: 지나가는 칸 목록
  chargePath(from,to){ const d=Rules.dirBetween(from,to); if(!d) return []; const n=Hex.dist(from,to), out=[]; for(let i=1;i<=n;i++) out.push([from[0]+d[0]*i,from[1]+d[1]*i]); return out; },
  canPlanBuild(g,pid,plan,unitId){
    const u=Game.unit(g,unitId);
    return !!u && u.owner===pid && Rules.canBuild(u) && !Game.siteOf(g,unitId) && !plan.some(a=>a&&a.type==='build'&&a.unitId===unitId);
  },
  // 이번 계획대로면 공사 중인 기술병이 움직이게 되는지
  movesBuilder(g,plan,unitId){ return !!Game.siteOf(g,unitId) || plan.some(a=>a&&a.type==='build'&&a.unitId===unitId); },
  buildTargets(g,pid,plan,unitId,type){
    if(!this.canPlanBuild(g,pid,plan,unitId)) return [];
    const u=Game.unit(g,unitId);
    const pos=this.positions(g,pid,plan), from=pos.get(unitId);
    const own=new Set(); pos.forEach(p=>own.add(Hex.key(p[0],p[1])));
    const pb=this.plannedBuildTiles(plan);
    return Hex.range(from,CONFIG.buildRange).map(([q,r])=>Hex.key(q,r))
      .filter(k=>Rules.canBuildTile(g,k,type) && !own.has(k) && !pb.has(k) && !this.knownBuildingAt(g,pid,k) && !this.knownEnemyAt(g,pid,k));
  },
  // 공격 대상: 계획상 위치에서 사거리 안의 보이는 상대 기물·건물
  attackTargets(g,pid,plan,unitId){
    const u=Game.unit(g,unitId); if(!u || !Rules.canAttack(u)) return [];
    const from=this.positions(g,pid,plan).get(unitId), rng=Rules.attackRange(g,u);
    return Hex.range(from,rng).map(([q,r])=>Hex.key(q,r))
      .filter(k=>{ if(!g.board.tiles.has(k)) return false; const e=this.knownEnemyAt(g,pid,k); if(e) return true; const b=this.knownBuildingAt(g,pid,k); return !!b && b.owner!==pid; });
  },
  attackTargetAt(g,pid,k){ const e=this.knownEnemyAt(g,pid,k); if(e) return {kind:'unit',id:e.id}; const b=this.knownBuildingAt(g,pid,k); return b&&b.owner!==pid?{kind:'building',id:b.id}:null; },
  canDefend(g,pid,plan,unitId){ const u=Game.unit(g,unitId); return !!u && u.owner===pid && !plan.some(a=>a&&a.type==='defend'&&a.unitId===unitId); },
  canScout(g,pid,plan,unitId){
    const u=Game.unit(g,unitId);
    return !!u && u.owner===pid && !plan.some(a=>a && a.type==='scout' && a.unitId===unitId);
  }
};

// 피해 판정 (기병 돌격). 일반 공격이 생기면 여기에 함께 둔다.
const Combat = {
  /* 피해 목록을 한꺼번에 처리한다. hits: [{t, kind:'unit'|'building', dmg, pid, unit, src:'공격'|'돌격'}]
     방어 중인 기물(g.defense[unitId]=방어 슬롯)은 피해를 받지 않고,
     방어 슬롯과 같은 슬롯의 공격이면 공격한 기물이 그 피해를 그대로 받는다. */
  apply(g,hits,slot){
    const name=pid=>g.players[pid].name, uMap=new Map(), bMap=new Map(), back=new Map();
    for(const h of hits){
      if(h.kind==='unit' && g.defense && g.defense[h.t.id]!=null){
        const same=g.defense[h.t.id]===slot;
        Log.add(g,{slot,pid:h.t.owner,priv:`방어 성공: 내 ${UNITS[h.t.type].name} (${h.t.q},${h.t.r})이(가) ${name(h.pid)}의 ${h.src}을 막음${same?` — 같은 슬롯이라 피해 ${h.dmg}를 되돌림`:''}`});
        Log.add(g,{slot,pid:h.pid,priv:`${h.src} 막힘: ${name(h.t.owner)}의 ${UNITS[h.t.type].name}이(가) 방어 중${same?` — 내 ${UNITS[h.unit.type].name}이(가) 피해 ${h.dmg}를 되돌려 받음`:''}`});
        if(same){ const e=back.get(h.unit)||0; back.set(h.unit,e+h.dmg); }
        continue;
      }
      const map=h.kind==='unit'?uMap:bMap, e=map.get(h.t)||{dmg:0,by:[]};
      e.dmg+=h.dmg; e.by.push(h); map.set(h.t,e);
    }
    for(const [v,e] of uMap){
      const at=`(${v.q},${v.r})`, died=this.damageUnit(g,v,e.dmg), att=[...new Set(e.by.map(b=>`${name(b.pid)}의 ${b.src}`))].join(', ');
      Log.add(g,{slot,pid:v.owner,priv: died ? `내 ${UNITS[v.type].name} ${at}이(가) ${att}에 쓰러짐` : `내 ${UNITS[v.type].name} ${at}이(가) ${att}으로 피해 ${e.dmg} (남은 체력 ${v.hp})`});
      e.by.forEach(b=>Log.add(g,{slot,pid:b.pid,priv:`${b.src} 명중: ${UNITS[b.unit.type].name} → ${name(v.owner)}의 ${UNITS[v.type].name} ${at}, 합계 피해 ${e.dmg}${died?' — 쓰러뜨림':''}`}));
    }
    for(const [bd,e] of bMap){
      if(!g.buildings.includes(bd)) continue;
      const B=BUILDINGS[bd.type], at=`(${bd.q},${bd.r})`, destroyed=this.damageBuilding(g,bd,e.dmg), att=[...new Set(e.by.map(b=>`${name(b.pid)}의 ${b.src}`))].join(', ');
      Log.add(g,{slot,pid:bd.owner,priv: destroyed ? `내 ${B.name} ${at}이(가) ${att}에 파괴됨` : `내 ${B.name} ${at}이(가) ${att}으로 피해 ${e.dmg} (남은 내구도 ${bd.dur})`});
      e.by.forEach(b=>Log.add(g,{slot,pid:b.pid,priv:`${b.src} 명중: ${name(bd.owner)}의 ${B.name} ${at}, 합계 피해 ${e.dmg}${destroyed?' — 파괴':''}`}));
    }
    for(const [u,dmg] of back){
      if(!u.alive) continue;
      const died=this.damageUnit(g,u,dmg);
      Log.add(g,{slot,pid:u.owner,priv:`되돌려 받은 피해: 내 ${UNITS[u.type].name} (${u.q},${u.r}) 피해 ${dmg}${died?' — 쓰러짐':` (남은 체력 ${u.hp})`}`});
    }
  },
  damageUnit(g,u,dmg){ u.hp=Math.max(0,u.hp-dmg); if(u.hp<=0) u.alive=false; return !u.alive; },
  damageBuilding(g,b,dmg){ b.dur=Math.max(0,b.dur-dmg); if(b.dur<=0){ g.buildings.splice(g.buildings.indexOf(b),1); return true; } return false; }
};

const Collision = {
  REASONS:{
    invalid:'유효하지 않은 이동',
    dead:'기물이 쓰러져 움직이지 못함',
    out_of_range:'이동 범위를 벗어남 (앞선 이동이 취소된 경우 등)',
    not_straight:'돌격은 한 방향 직선으로만 가능 (앞선 이동이 취소된 경우 등)',
    blocked:'길이 막혀 움직이지 못함',
    building:'목표 칸에 건물이 있음',
    same_target:'여러 기물이 같은 칸으로 이동하려 함',
    occupied:'목표 칸에 다른 기물이 있음',
    swap:'두 기물이 서로 자리를 맞바꾸려 함'
  },
  resolveMoves(g,intents){
    const canceled=[]; let active=[];
    for(const it of intents){
      if(it.forceCancel){ canceled.push(it); continue; }
      const u=g.units.find(x=>x.id===it.unitId), tk=Hex.key(it.to[0],it.to[1]);
      if(u && !u.alive){ canceled.push(Object.assign({},it,{unit:u,reason:'dead'})); continue; }
      if(!u || u.owner!==it.pid || !g.board.tiles.has(tk)){ canceled.push(Object.assign({},it,{reason:'invalid'})); continue; }
      const d=Hex.dist([u.q,u.r],it.to);
      if(d===0 || d>Rules.moveRange(g,u)){ canceled.push(Object.assign({},it,{unit:u,reason:'out_of_range'})); continue; }
      if(Game.buildingAt(g,tk)){ canceled.push(Object.assign({},it,{unit:u,reason:'building'})); continue; }
      active.push(Object.assign({},it,{unit:u,fromKey:Hex.key(u.q,u.r),toKey:tk}));
    }
    const cnt={}; active.forEach(a=>cnt[a.toKey]=(cnt[a.toKey]||0)+1);
    active=active.filter(a=>{ if(cnt[a.toKey]>1){ canceled.push(Object.assign(a,{reason:'same_target'})); return false; } return true; });
    for(let changed=true; changed;){
      changed=false;
      const byUnit=new Map(active.map(a=>[a.unit.id,a])), drop=new Map();
      for(const a of active){
        const occ=Game.unitAt(g,a.toKey); if(!occ) continue;
        const om=byUnit.get(occ.id);
        if(!om) drop.set(a.unit.id,'occupied');
        else if(om.toKey===a.fromKey){ drop.set(a.unit.id,'swap'); drop.set(om.unit.id,'swap'); }
      }
      if(drop.size){ changed=true; active=active.filter(a=>{ if(drop.has(a.unit.id)){ canceled.push(Object.assign(a,{reason:drop.get(a.unit.id)})); return false; } return true; }); }
    }
    for(const a of active){ a.unit.q=a.to[0]; a.unit.r=a.to[1]; }
    return {applied:active,canceled};
  }
};

const ActionHandlers = {
  move:{
    describe:(g,a)=>{ const u=g.units.find(x=>x.id===a.unitId); const nm=u?UNITS[u.type].name:'기물';
      return u&&Rules.isCharge(u) ? `${nm} 돌격 (${Hex.fmt(a.from)}) → (${Hex.fmt(a.to)})` : `${nm} (${Hex.fmt(a.from)}) → (${Hex.fmt(a.to)})`; },
    resolveSlot(g,list,slot){
      const name=pid=>g.players[pid].name;
      const intents=[], allHits=[], chargeNotes=[];
      // 1) 돌격 경로와 피해를 슬롯 시작 위치 기준으로 계산
      for(const x of list){
        const u=Game.unit(g,x.act.unitId);
        if(!u || u.owner!==x.pid || !Rules.isCharge(u)){ intents.push({pid:x.pid,unitId:x.act.unitId,to:x.act.to}); continue; }
        const from=[u.q,u.r], to=x.act.to, n=Hex.dist(from,to), dir=Rules.dirBetween(from,to);
        if(!dir || n>Rules.moveRange(g,u)){ intents.push({pid:x.pid,unitId:u.id,to,unit:u,forceCancel:true,reason:'not_straight'}); continue; }
        const path=[], hits=[];
        for(let i=1;i<=n;i++){
          const c=[from[0]+dir[0]*i, from[1]+dir[1]*i], k=Hex.key(c[0],c[1]);
          if(!g.board.tiles.has(k)) break;
          const b=Game.buildingAt(g,k);
          if(b){ if(b.owner!==u.owner) hits.push({b}); break; }
          const o=Game.unitAt(g,k);
          if(o && o.owner!==u.owner) hits.push({u:o});
          path.push(c);
        }
        let idx=path.length-1;
        while(idx>=0 && Game.unitAt(g,Hex.key(path[idx][0],path[idx][1]))) idx--;
        const dest = idx>=0 ? path[idx] : null;
        const dmg=Rules.chargeDamage(g,u);
        for(const h of hits) allHits.push({t:h.u||h.b,kind:h.u?'unit':'building',dmg,pid:x.pid,unit:u,src:'돌격'});
        chargeNotes.push({x,u,from,want:to,dest,hits,dmg});
        if(dest) intents.push({pid:x.pid,unitId:u.id,to:dest,charge:true,want:to});
        else intents.push({pid:x.pid,unitId:u.id,to,unit:u,forceCancel:true,reason:'blocked'});
      }
      // 2) 피해를 동시에 적용 (방어 반영)
      Combat.apply(g,allHits,slot);
      // 3) 이동 처리 (쓰러진 기물의 이동은 취소)
      const res=Collision.resolveMoves(g,intents);
      res.applied.forEach(a=>{
        const short = a.charge && (a.want[0]!==a.to[0]||a.want[1]!==a.to[1]);
        Log.add(g,{slot,pid:a.pid,pub:`${name(a.pid)}: 이동`,priv:`${a.charge?'돌격':'이동'} 완료: ${UNITS[a.unit.type].name} (${a.fromKey}) → (${a.toKey})${short?' · 길이 막혀 앞에서 멈춤':''}`});
      });
      res.canceled.forEach(a=>Log.add(g,{slot,pid:a.pid,pub:`${name(a.pid)}: 이동`,priv:`이동 취소: ${a.unit?UNITS[a.unit.type].name:'기물'} → (${Hex.fmt(a.to)}) · ${Collision.REASONS[a.reason]}`}));
    }
  },
  scout:{
    describe:(g,a)=>{ const u=g.units.find(x=>x.id===a.unitId); const at=a.at||(u?[u.q,u.r]:null); return `${u?UNITS[u.type].name:'기물'} (${at?Hex.fmt(at):'?'}) 자리에서 정찰`; },
    resolveSlot(g,list,slot){
      list.forEach(x=>{
        const u=Game.unit(g,x.act.unitId), pub=`${g.players[x.pid].name}: 정찰`;
        if(u && u.owner===x.pid){
          const until=g.turn+CONFIG.scoutDuration;
          g.scouts.push({pid:x.pid,q:u.q,r:u.r,radius:Rules.scoutRange(g,u),until});
          Log.add(g,{slot,pid:x.pid,pub,priv:`정찰 완료: (${u.q},${u.r}) 주변 ${Rules.scoutRange(g,u)}칸 — 턴 ${until}이 끝날 때까지 보임`});
        } else Log.add(g,{slot,pid:x.pid,pub,priv:'정찰 실패: 대상 기물이 없음'});
      });
    }
  },
  build:{
    describe:(g,a)=>{ const u=g.units.find(x=>x.id===a.unitId); return `${BUILDINGS[a.building].name} 건설 (${Hex.fmt(a.at)}) — ${u?UNITS[u.type].name:'기물'}`; },
    resolveSlot(g,list,slot){
      const byTile=new Map();
      list.forEach(x=>{ const k=Hex.key(x.act.at[0],x.act.at[1]); if(!byTile.has(k)) byTile.set(k,[]); byTile.get(k).push(x); });
      for(const [k,arr] of byTile){
        const fail=(x,why)=>Log.add(g,{slot,pid:x.pid,pub:`${g.players[x.pid].name}: 건설`,priv:`건설 실패: ${BUILDINGS[x.act.building].name} (${k}) · ${why}`});
        if(arr.length>1){ arr.forEach(x=>fail(x,'여러 플레이어가 같은 칸에 동시에 건설하려 함')); continue; }
        const x=arr[0], B=BUILDINGS[x.act.building], u=Game.unit(g,x.act.unitId), p=g.players[x.pid];
        if(!B || B.buildable===false) { fail(x,'지을 수 없는 건물'); continue; }
        if(B.civ && B.civ!==p.civ){ fail(x,'다른 문명의 건물'); continue; }
        if(u && !Rules.canBuild(u)){ fail(x,`${UNITS[u.type].name}은(는) 건설할 수 없음`); continue; }
        if(u && Game.siteOf(g,u.id)){ fail(x,'이 기술병은 이미 다른 곳을 짓는 중'); continue; }
        if(!u || u.owner!==x.pid){ fail(x,'건설할 기물이 없음'); continue; }
        if(Hex.dist([u.q,u.r],x.act.at)>CONFIG.buildRange){ fail(x,'기물이 그 칸 옆에 있지 않음'); continue; }
        if(!Rules.canBuildTile(g,k,B.id)){ fail(x,B.onResource?'자원 칸이 아님':'자원 칸에는 보급소만 지을 수 있음'); continue; }
        if(Game.unitAt(g,k)){ fail(x,'칸에 기물이 있음'); continue; }
        if(Game.buildingAt(g,k)){ fail(x,'칸에 이미 건물이 있음'); continue; }
        if(p.points<B.cost){ fail(x,`포인트 부족 (${B.cost}점 필요)`); continue; }
        p.points-=B.cost;
        const completeAt=g.turn+CONFIG.buildTurns;
        g.buildings.push({id:g.nextBuildingId++,owner:x.pid,type:B.id,q:x.act.at[0],r:x.act.at[1],dur:B.durability,max:B.durability,
          done:false,techId:u.id,techPos:[u.q,u.r],completeAt,paid:B.cost});
        Log.add(g,{slot,pid:x.pid,pub:`${p.name}: 건설`,priv:`공사 시작: ${B.name} (${k}) · ${B.cost}점 사용 · 기술병이 턴 ${completeAt}이 끝날 때까지 움직이지 않으면 완공`});
      }
    }
  },
  recruit:{
    describe:(g,a)=>{ const b=(g.buildings||[]).find(x=>x.id===a.buildingId); return `${b?BUILDINGS[b.type].name:'건물'}에서 ${UNITS[a.unit].name} 모집 (${Hex.fmt(a.at)}) · ${UNITS[a.unit].cost}점`; },
    resolveSlot(g,list,slot){
      const byTile=new Map();
      list.forEach(x=>{ const k=Hex.key(x.act.at[0],x.act.at[1]); if(!byTile.has(k)) byTile.set(k,[]); byTile.get(k).push(x); });
      for(const [k,arr] of byTile){
        const fail=(x,why)=>Log.add(g,{slot,pid:x.pid,pub:`${g.players[x.pid].name}: 모집`,priv:`모집 실패: ${UNITS[x.act.unit].name} (${k}) · ${why}`});
        if(arr.length>1){ arr.forEach(x=>fail(x,'여러 플레이어가 같은 칸에 동시에 모집하려 함')); continue; }
        const x=arr[0], p=g.players[x.pid], U=UNITS[x.act.unit], b=(g.buildings||[]).find(z=>z.id===x.act.buildingId);
        if(!b || b.owner!==x.pid || b.done===false || !BUILDINGS[b.type].summon){ fail(x,'모집할 건물이 없음'); continue; }
        if(g.recruitUsed[b.id]){ fail(x,'이 건물은 이번 턴에 이미 모집함'); continue; }
        if(!Rules.unitsFor(p.civ).includes(U)){ fail(x,'모집할 수 없는 기물'); continue; }
        if(Hex.dist([b.q,b.r],x.act.at)!==1 || !g.board.tiles.has(k)){ fail(x,'건물 바로 옆 칸이 아님'); continue; }
        if(Game.unitAt(g,k) || Game.buildingAt(g,k)){ fail(x,'칸이 비어 있지 않음'); continue; }
        if(p.points<U.cost){ fail(x,`포인트 부족 (${U.cost}점 필요)`); continue; }
        p.points-=U.cost;
        Game.newUnit(g,x.pid,U.id,x.act.at[0],x.act.at[1]); g.recruitUsed[b.id]=true;
        Log.add(g,{slot,pid:x.pid,pub:`${p.name}: 모집`,priv:`모집 완료: ${BUILDINGS[b.type].name} 옆 (${k})에 ${U.name} · ${U.cost}점 사용`});
      }
    }
  },
  upgrade:{
    describe:(g,a)=>`보병 → ${UNITS[a.into].name} 강화 (${UNITS[a.into].upgradeCost}점)`,
    resolveSlot(g,list,slot){
      list.forEach(x=>{
        const p=g.players[x.pid], S=UNITS[x.act.into], u=Game.unit(g,x.act.unitId);
        const fail=why=>Log.add(g,{slot,pid:x.pid,pub:`${p.name}: 강화`,priv:`강화 실패: ${why}`});
        if(!u || u.owner!==x.pid) return fail('기물이 없음');
        if(!S || S.civ!==p.civ || u.type!==S.upgradeFrom) return fail('강화할 수 없는 기물');
        const b=Game.buildingsOf(g,x.pid).find(b=>b.type===S.requires && b.done!==false && Hex.dist([b.q,b.r],[u.q,u.r])<=1);
        if(!b) return fail(`${BUILDINGS[S.requires].name} 바로 옆에 있지 않음 (완공된 건물만 가능)`);
        if(p.points<S.upgradeCost) return fail(`포인트 부족 (${S.upgradeCost}점 필요)`);
        p.points-=S.upgradeCost;
        const lost=Rules.maxHp(u)-u.hp; u.type=S.id; u.hp=Math.max(1,Rules.maxHp(u)-lost);
        Log.add(g,{slot,pid:x.pid,pub:`${p.name}: 강화`,priv:`강화 완료: 보병 (${u.q},${u.r}) → ${S.name} · ${S.upgradeCost}점 사용 · 체력 ${u.hp}/${Rules.maxHp(u)}`});
      });
    }
  },
  attack:{
    describe:(g,a)=>{ const u=g.units.find(x=>x.id===a.unitId); const t=a.target&&a.target.kind==='building'?(g.buildings.find(b=>b.id===a.target.id)):g.units.find(x=>a.target&&x.id===a.target.id);
      const tn=t?(a.target.kind==='building'?BUILDINGS[t.type].name:UNITS[t.type].name):'대상';
      return `${u?UNITS[u.type].name:'기물'} → (${Hex.fmt(a.at)}) ${tn} 공격`; },
    resolveSlot(g,list,slot){
      const name=pid=>g.players[pid].name, allHits=[];
      const fail=(x,why)=>Log.add(g,{slot,pid:x.pid,pub:`${name(x.pid)}: 공격`,priv:`공격 실패: ${why}`});
      // 슬롯 시작 위치 기준으로 모두 계산한 뒤 동시에 적용
      for(const x of list){
        const u=Game.unit(g,x.act.unitId), tg=x.act.target||{};
        if(!u || u.owner!==x.pid){ fail(x,'공격할 기물이 없음'); continue; }
        if(!Rules.canAttack(u)){ fail(x,`${UNITS[u.type].name}은(는) 공격할 수 없음`); continue; }
        const t = tg.kind==='building' ? g.buildings.find(b=>b.id===tg.id) : Game.unit(g,tg.id);
        if(!t){ fail(x,'대상이 이미 없음'); continue; }
        if(t.owner===x.pid){ fail(x,'자기 기물은 공격할 수 없음'); continue; }
        if(Hex.dist([u.q,u.r],[t.q,t.r])>Rules.attackRange(g,u)){ fail(x,`${UNITS[u.type].name} (${u.q},${u.r}) — 대상이 사거리 밖에 있음`); continue; }
        Log.add(g,{slot,pid:x.pid,pub:`${name(x.pid)}: 공격`});
        allHits.push({t,kind:tg.kind==='building'?'building':'unit',dmg:Rules.attackDamage(g,u),pid:x.pid,unit:u,src:'공격'});
      }
      Combat.apply(g,allHits,slot);
    }
  },
  defend:{
    describe:(g,a)=>{ const u=g.units.find(x=>x.id===a.unitId); return `${u?UNITS[u.type].name:'기물'} (${u?Hex.fmt([u.q,u.r]):'?'}) 방어`; },
    // 방어 효과는 턴 시작 때 Defense.prepare 가 이미 걸어 둔다. 여기서는 기록만 한다.
    resolveSlot(g,list,slot){ list.forEach(x=>Log.add(g,{slot,pid:x.pid,pub:`${g.players[x.pid].name}: 방어`})); }
  }
};

// 공사: 기술병이 움직이거나 쓰러지면 취소, 정해진 턴이 끝나면 완공
const Construction = {
  cancel(g,b,why,slot){
    g.buildings.splice(g.buildings.indexOf(b),1);
    g.players[b.owner].points+=b.paid||0;
    Log.add(g,{slot,pid:b.owner,priv:`공사 취소: ${BUILDINGS[b.type].name} (${b.q},${b.r}) · ${why} · ${b.paid||0}점 돌려받음`});
  },
  onUnitMoved(g,u,slot){ const b=Game.siteOf(g,u.id); if(b) this.cancel(g,b,'기술병이 움직임',slot); },
  checkSlot(g,slot){
    for(const b of (g.buildings||[]).filter(x=>x.done===false)){
      const t=g.units.find(u=>u.id===b.techId);
      if(!t || !t.alive) this.cancel(g,b,'기술병이 쓰러짐',slot);
      else if(t.q!==b.techPos[0] || t.r!==b.techPos[1]) this.cancel(g,b,'기술병이 움직임',slot);
    }
  },
  endTurn(g){
    for(const b of (g.buildings||[]).filter(x=>x.done===false && g.turn>=x.completeAt)){
      b.done=true;
      Log.add(g,{slot:null,pid:b.owner,priv:`완공: ${BUILDINGS[b.type].name} (${b.q},${b.r}) · 내구도 ${b.dur}/${b.max}`});
    }
  }
};

// 방어: 제출된 계획에서 이번 턴 방어하는 기물과 그 슬롯을 턴 시작 때 정한다
const Defense = {
  prepare(g){
    g.defense={};
    for(const p of g.players) (g.plans[p.id]||[]).forEach((a,i)=>{
      if(!a || a.type!=='defend') return;
      const u=Game.unit(g,a.unitId);
      if(u && u.owner===p.id && g.defense[u.id]==null){ g.defense[u.id]=i+1; Log.add(g,{slot:i+1,pid:p.id,priv:`방어: ${UNITS[u.type].name} (${u.q},${u.r}) — 이번 턴 피해 무효, 슬롯 ${i+1} 공격은 되돌림`}); }
    });
  }
};

// 승리: 본진이 파괴되면 탈락, 마지막 한 명이 승리
const Victory = {
  alive(g){ return g.players.filter(p=>!p.eliminated); },
  check(g,slot){
    const lost=this.alive(g).filter(p=>!Purchase.hqOf(g,p.id));
    for(const p of lost){
      p.eliminated=true; p.elimTurn=g.turn;
      g.units.forEach(u=>{ if(u.owner===p.id) u.alive=false; });
      g.buildings=g.buildings.filter(b=>b.owner!==p.id);
      Log.add(g,{slot,pub:`${p.name}의 본진이 파괴되었습니다. ${p.name} 탈락.`});
    }
    const left=this.alive(g);
    if(left.length<=1 && !g.over){
      g.over={winner:left.length?left[0].id:-1,turn:g.turn};
      Log.add(g,{slot,pub: left.length?`${left[0].name} 승리!`:'모든 본진이 동시에 파괴되어 무승부입니다.'});
    }
    return !!g.over;
  }
};

const Resolver = {
  resolveTurn(g){
    Defense.prepare(g);
    g.recruitUsed={};
    for(let s=0;s<CONFIG.actionsPerTurn;s++){
      const slot=s+1;
      const all=g.players.map(p=>({pid:p.id,act:(g.plans[p.id]||[])[s]})).filter(x=>x.act);
      g.players.forEach(p=>{ if(!p.eliminated && !(g.plans[p.id]||[])[s]) Log.add(g,{slot,pid:p.id,pub:`${p.name}: 행동 없음`,priv:'행동 없음'}); });
      const byType={}; all.forEach(x=>(byType[x.act.type]=byType[x.act.type]||[]).push(x));
      for(const type of CONFIG.resolveOrder){
        if(!byType[type]) continue;
        const h=ActionHandlers[type];
        if(h && h.resolveSlot) h.resolveSlot(g,byType[type],slot);
        else byType[type].forEach(x=>Log.add(g,{slot,pid:x.pid,pub:`${g.players[x.pid].name}: ${ACTIONS[type].name} (미구현)`,priv:`${ACTIONS[type].name}: 미구현 행동이라 처리하지 않음`}));
      }
      Construction.checkSlot(g,slot);
      Vision.update(g);
      CenterZone.update(g,slot);
      if(Victory.check(g,slot)) break;
    }
    g.defense={};
  }
};

const AI = {
  pickCiv(){ return pick(Object.keys(CIVS)); },
  setup(g,pid){ return (g.aiLevel||'normal')==='easy' ? this.setupEasy(g,pid) : this.setupSmart(g,pid); },
  plan(g,pid){ const l=g.aiLevel||'normal'; return l==='easy' ? this.planEasy(g,pid) : this.planSmart(g,pid,l); },
  /* ---------- 보통·어려움: 점수 기반 계획 ----------
     매 슬롯마다 가능한 행동(공격, 돌격·이동, 보급소·건물 건설, 강화, 모집, 방어)을 모두 만들어 점수를 매기고 고른다.
     상대 정보는 자기 시야(visible)와 공개 정보(시작 영역 위치)만 쓴다. */
  setupSmart(g,pid){
    const p=g.players[pid], lvl=g.aiLevel||'normal', keep=lvl==='hard'?3:2;
    const order=['technician','infantry','cavalry','guardian','infantry','cavalry','infantry','guardian','infantry'];
    const avail=new Set(Rules.unitsFor(p.civ).map(u=>u.id));
    for(let i=0, guard=0; guard<60; guard++, i++){
      const t=order[i%order.length]; if(!avail.has(t)) continue;
      if(p.points-UNITS[t].cost<keep){ if(p.points-1>=keep){ Purchase.buy(p,'infantry'); continue; } break; }
      Purchase.buy(p,t);
    }
    Purchase.autoHQ(g,pid);
    const hq=Purchase.hqOf(g,pid);
    const free=Board.zoneTiles(g.board,pid).filter(k=>Purchase.canPlaceAt(g,pid,k)).sort((a,b)=>Hex.dist(Hex.parse(a),[0,0])-Hex.dist(Hex.parse(b),[0,0]));
    const near=hq?free.slice().sort((a,b)=>Hex.dist(Hex.parse(a),[hq.q,hq.r])-Hex.dist(Hex.parse(b),[hq.q,hq.r])):free.slice();
    const take=(list)=>{ const k=list.find(x=>Purchase.canPlaceAt(g,pid,x)); return k; };
    for(const type of ['guardian','technician']) while(p.reserve[type]>0){ const k=take(near); if(!k) break; Purchase.place(g,pid,type,k); }
    for(const type of Object.keys(p.reserve)) while(p.reserve[type]>0){ const k=take(free); if(!k) break; Purchase.place(g,pid,type,k); }
  },
  planSmart(g,pid,lvl){
    const p=g.players[pid], plan=[];
    if(p.eliminated) return plan;
    const hard=lvl==='hard', noise=hard?()=>0.95+Math.random()*0.1:()=>0.75+Math.random()*0.5;
    const myHQ=Purchase.hqOf(g,pid), home=myHQ?[myHQ.q,myHQ.r]:CONFIG.startZone.corners[pid];
    const enemies=g.players.filter(x=>x.id!==pid && !x.eliminated);
    if(!enemies.length) return plan;
    const seenUnits=[...p.visible].map(k=>Game.unitAt(g,k)).filter(u=>u && u.owner!==pid);
    // 공격 목표: 보이는 상대 본진 중 가장 가까운 것, 없으면 가장 가까운 상대의 시작 영역 꼭짓점
    const seenHQ=(g.buildings||[]).filter(b=>b.type==='hq' && b.owner!==pid && p.visible.has(Hex.key(b.q,b.r)));
    const tgtPlayer=enemies.slice().sort((a,b)=>Hex.dist(home,CONFIG.startZone.corners[a.id])-Hex.dist(home,CONFIG.startZone.corners[b.id]))[0];
    const attackGoal = seenHQ.length ? (h=>[h.q,h.r])(seenHQ.sort((a,b)=>Hex.dist([a.q,a.r],home)-Hex.dist([b.q,b.r],home))[0]) : CONFIG.startZone.corners[tgtPlayer.id];
    const homeThreat=seenUnits.filter(u=>Hex.dist([u.q,u.r],home)<=3).sort((a,b)=>Hex.dist([a.q,a.r],home)-Hex.dist([b.q,b.r],home));
    const centerKeys=CenterZone.keys(), centerC=Hex.parse(centerKeys[0]);
    const units0=Game.unitsOf(g,pid);
    // 중앙 담당: 건설 기물·수호병이 아닌 기물 중 중앙에 가장 가까운 하나
    const fighters=units0.filter(u=>!Rules.canBuild(u) && u.type!=='guardian');
    const centerUnit = g.centerEffect && fighters.length>2 ? fighters.slice().sort((a,b)=>Hex.dist([a.q,a.r],centerC)-Hex.dist([b.q,b.r],centerC))[0].id : null;
    // 본진 근처에 상대가 오면 가까운 기물 몇 개만 막으러 가고, 나머지는 계속 공격 목표로
    const responders=new Set(homeThreat.length ? units0.filter(u=>!Rules.canBuild(u)).sort((a,b)=>Hex.dist([a.q,a.r],home)-Hex.dist([b.q,b.r],home)).slice(0,Math.min(3,homeThreat.length+1)).map(u=>u.id) : []);
    // 공격 목표에 가장 가까운 선두 기물들을 더 밀어 준다
    const spear=new Set(fighters.filter(u=>!responders.has(u.id)).sort((a,b)=>Hex.dist([a.q,a.r],attackGoal)-Hex.dist([b.q,b.r],attackGoal)).slice(0,4).map(u=>u.id));
    const freeRes=(plan)=>{ const pb=Plan.plannedBuildTiles(plan); return (g.resources||[]).filter(k=>!Game.buildingAt(g,k) && !pb.has(k)).map(Hex.parse); };
    const civB=Rules.buildable(p.civ).find(b=>b.civ);
    const hasCivB=civB && Game.buildingsOf(g,pid).some(b=>b.type===civB.id);
    const hasCamp=Game.buildingsOf(g,pid).some(b=>b.type==='camp');
    const plannedDmg=new Map(), dmgOn=t=>plannedDmg.get(t)||0;
    const goalFor=(u,from)=>{
      if(Rules.canBuild(u) && !Game.siteOf(g,u.id)){
        const fr=freeRes(plan).filter(c=>Hex.dist(c,home)<=11).sort((a,b)=>Hex.dist(a,from)-Hex.dist(b,from));
        return fr.length ? fr[0] : home;
      }
      if(responders.has(u.id)) return [homeThreat[0].q,homeThreat[0].r];
      if(u.type==='guardian') return home;
      if(u.id===centerUnit && !CenterZone.isActiveFor(g,pid)) return centerC;
      if(u.id===centerUnit && centerKeys.includes(Hex.key(from[0],from[1]))) return from;
      return attackGoal;
    };
    for(let s=0;s<CONFIG.actionsPerTurn;s++){
      const units=Game.unitsOf(g,pid), pos=Plan.positions(g,pid,plan), left=p.points-Plan.plannedCost(plan), cands=[];
      const add=(sc,act)=>{ if(sc>0) cands.push({sc:sc*noise(),act}); };
      // 공격
      for(const u of units){
        if(!Rules.canAttack(u)) continue;
        for(const k of Plan.attackTargets(g,pid,plan,u.id)){
          const tg=Plan.attackTargetAt(g,pid,k); if(!tg) continue;
          const t= tg.kind==='unit' ? Game.unit(g,tg.id) : g.buildings.find(b=>b.id===tg.id); if(!t) continue;
          const d=Rules.attackDamage(g,u), rem=(tg.kind==='unit'?t.hp:t.dur)-dmgOn(t); if(rem<=0) continue;
          let sc=11+d*2+(d>=rem?14:0);
          if(tg.kind==='building') sc+= t.type==='hq'?(rem<=6?20:12) : t.type==='depot'?9 : t.done===false?7 : 3;
          add(sc,{type:'attack',unitId:u.id,target:tg,at:Hex.parse(k),from:pos.get(u.id),_t:t,_d:d});
        }
      }
      // 이동·돌격
      for(const u of units){
        if(Plan.movesBuilder(g,plan,u.id)) continue;
        const from=pos.get(u.id), goal=goalFor(u,from);
        for(const k of Plan.moveTargets(g,pid,plan,u.id)){
          const to=Hex.parse(k);
          const prog=Hex.dist(from,goal)-Hex.dist(to,goal);
          let sc = Rules.canBuild(u) ? prog*4+(prog>0?2:0) : (spear.has(u.id)||responders.has(u.id)||u.id===centerUnit) ? prog*3+(prog>0?1.5:0) : prog*1.2;
          let hits=[];
          if(Rules.isCharge(u)){
            const dd=Rules.chargeDamage(g,u);
            for(const c of Plan.chargePath(from,to)){
              const ck=Hex.key(c[0],c[1]), e=Plan.knownEnemyAt(g,pid,ck);
              if(e){ const rem=e.hp-dmgOn(e); if(rem>0){ sc+=8+(dd>=rem?12:0); hits.push([e,dd]); } }
              const b=Plan.knownBuildingAt(g,pid,ck); if(b && b.owner!==pid) sc+= b.type==='hq'?10:6;
            }
          }
          if(centerKeys.includes(k) && g.centerEffect && !CenterZone.isActiveFor(g,pid)) sc+= u.id===centerUnit?9:3;
          const adj=seenUnits.filter(e=>Hex.dist([e.q,e.r],to)<=1).length;
          if(adj>=2 && u.hp<=2) sc-=6;
          if(adj>=1 && Rules.canBuild(u)) sc-=4;
          add(sc,{type:'move',unitId:u.id,from,to,_hits:hits});
        }
      }
      // 건설
      for(const u of units.filter(u=>Plan.canPlanBuild(g,pid,plan,u.id))){
        const from=pos.get(u.id);
        if(left>=BUILDINGS.depot.cost){ const t=Plan.buildTargets(g,pid,plan,u.id,'depot'); if(t.length) add(17,{type:'build',unitId:u.id,building:'depot',at:Hex.parse(t[0]),from}); }
        if(civB && !hasCivB && left>=civB.cost+1 && g.turn>=3 && Hex.dist(from,home)<=4){
          const t=Plan.buildTargets(g,pid,plan,u.id,civB.id).sort((a,b)=>Hex.dist(Hex.parse(a),home)-Hex.dist(Hex.parse(b),home));
          if(t.length) add(9,{type:'build',unitId:u.id,building:civB.id,at:Hex.parse(t[0]),from});
        }
        if(!hasCamp && left>=BUILDINGS.camp.cost+2 && g.turn>=6 && Hex.dist(from,home)>=4){
          const t=Plan.buildTargets(g,pid,plan,u.id,'camp'); if(t.length) add(hard?6:4,{type:'build',unitId:u.id,building:'camp',at:Hex.parse(t[0]),from});
        }
        if(homeThreat.length && left>=1 && Hex.dist(from,home)<=2){
          const t=Plan.buildTargets(g,pid,plan,u.id,'wall'); if(t.length) add(4,{type:'build',unitId:u.id,building:'wall',at:Hex.parse(t[0]),from});
        }
      }
      // 강화
      for(const u of units){ const i=Plan.upgradeInfo(g,pid,plan,u.id); if(i && i.affordable) add(12,{type:'upgrade',unitId:u.id,into:i.into}); }
      // 모집
      const builders=units.filter(u=>Rules.canBuild(u)).length;
      for(const b of Game.buildingsOf(g,pid)){
        const tiles=Plan.recruitTargets(g,pid,plan,b.id); if(!tiles.length) continue;
        const opts=Rules.unitsFor(p.civ).filter(U=>U.cost<=left); if(!opts.length) continue;
        let U;
        if(!builders && freeRes(plan).length && opts.some(o=>o.id==='technician')) U=UNITS.technician;
        else if(homeThreat.length && opts.some(o=>o.id==='guardian')) U=UNITS.guardian;
        else if(opts.some(o=>o.id==='cavalry') && Math.random()<0.5) U=UNITS.cavalry;
        else U=UNITS.infantry;
        if(!opts.includes(U)) U=opts[0];
        const goal=homeThreat.length?[homeThreat[0].q,homeThreat[0].r]:attackGoal;
        const k=tiles.sort((a,c)=>Hex.dist(Hex.parse(a),goal)-Hex.dist(Hex.parse(c),goal))[0];
        add((units.length<10?8:3)+(units.length<6?5:0)+(U.id==='technician'?4:0),{type:'recruit',buildingId:b.id,unit:U.id,at:Hex.parse(k)});
      }
      // 방어: 공격받을 만한 기물
      for(const u of units){
        if(!Plan.canDefend(g,pid,plan,u.id)) continue;
        const at=pos.get(u.id);
        const danger=seenUnits.filter(e=>{ const d=Hex.dist([e.q,e.r],at); return (Rules.canAttack(e)&&d<=Rules.attackRange(g,e)) || (Rules.isCharge(e)&&d<=Rules.moveRange(g,e)&&Rules.dirBetween([e.q,e.r],at)); });
        if(!danger.length) continue;
        const incoming=danger.reduce((s,e)=>s+(Rules.isCharge(e)?Rules.chargeDamage(g,e):Rules.attackDamage(g,e)),0);
        if(incoming>=u.hp || (hard && UNITS[u.type].civ)) add(8+(UNITS[u.type].civ?3:0)+(Rules.canBuild(u)?2:0),{type:'defend',unitId:u.id});
      }
      if(!cands.length) break;
      cands.sort((a,b)=>b.sc-a.sc);
      const c = hard ? cands[0] : cands[Math.floor(Math.random()*Math.min(3,cands.length))];
      const a=c.act;
      if(a._t) plannedDmg.set(a._t,dmgOn(a._t)+a._d);
      if(a._hits) a._hits.forEach(([e,d])=>plannedDmg.set(e,dmgOn(e)+d));
      delete a._t; delete a._d; delete a._hits;
      plan.push(a);
    }
    return plan;
  },

  // ---------- 쉬움: 무작위에 가까운 테스트용 ----------
  setupEasy(g,pid){
    const p=g.players[pid];
    for(let guard=0; guard<100; guard++){
      if(guard===0 && Math.random()<0.7){ Purchase.buy(p,'technician'); continue; }   // 대개 기술병 하나로 시작
      if(p.points<=4 && Math.random()<0.7) break;          // 건설용 포인트를 남김
      const opts=Rules.unitsFor(p.civ).filter(t=>t.cost<=p.points).map(t=>t.id);
      if(!opts.length) break;
      Purchase.buy(p,pick(opts));
    }
    Purchase.autoPlace(g,pid);
  },
  planEasy(g,pid){
    const plan=[], p=g.players[pid];
    if(p.eliminated) return plan;
    for(let s=0;s<CONFIG.actionsPerTurn;s++){
      const units=Game.unitsOf(g,pid);
      if(!units.length){ const U=Rules.unitsFor(p.civ).filter(U=>U.cost<=p.points-Plan.plannedCost(plan)); const sp=[]; Game.buildingsOf(g,pid).forEach(b=>Plan.recruitTargets(g,pid,plan,b.id).forEach(k=>sp.push([b,k])));
        if(U.length&&sp.length){ const [b,k]=pick(sp); plan.push({type:'recruit',buildingId:b.id,unit:pick(U).id,at:Hex.parse(k)}); continue; } break; }
      const roll=Math.random();
      if(roll<0.15){
        const c=units.filter(u=>Plan.canScout(g,pid,plan,u.id));
        if(c.length){ const su=pick(c); plan.push({type:'scout',unitId:su.id,at:Plan.positions(g,pid,plan).get(su.id)}); continue; }
      } else if(roll<0.28){
        const afford=Rules.buildable(p.civ).filter(B=>B.cost<=p.points-Plan.plannedCost(plan));
        const builders=units.filter(u=>Plan.canPlanBuild(g,pid,plan,u.id));
        if(afford.length && builders.length){ const bu=pick(builders), B=pick(afford), t=Plan.buildTargets(g,pid,plan,bu.id,B.id);
          if(t.length){ plan.push({type:'build',unitId:bu.id,building:B.id,at:Hex.parse(pick(t)),from:Plan.positions(g,pid,plan).get(bu.id)}); continue; } }
      }
      if(BUILDINGS.depot.cost<=p.points-Plan.plannedCost(plan)){
        const opts=[]; units.filter(u=>Plan.canPlanBuild(g,pid,plan,u.id)).forEach(u=>Plan.buildTargets(g,pid,plan,u.id,'depot').forEach(k=>opts.push([u,k])));
        if(opts.length && Math.random()<0.9){ const [bu,k]=pick(opts); plan.push({type:'build',unitId:bu.id,building:'depot',at:Hex.parse(k),from:Plan.positions(g,pid,plan).get(bu.id)}); continue; }
      }
      const left=p.points-Plan.plannedCost(plan), opts=Rules.unitsFor(p.civ).filter(U=>U.cost<=left);
      if(opts.length && Math.random()<0.45){
        const spots=[]; Game.buildingsOf(g,pid).forEach(b=>Plan.recruitTargets(g,pid,plan,b.id).forEach(k=>spots.push([b,k])));
        if(spots.length){ const [b,k]=pick(spots); plan.push({type:'recruit',buildingId:b.id,unit:pick(opts).id,at:Hex.parse(k)}); continue; }
      }
      const upg=units.map(u=>[u,Plan.upgradeInfo(g,pid,plan,u.id)]).filter(([,i])=>i&&i.affordable);
      if(upg.length && Math.random()<0.7){ const [u,i]=pick(upg); plan.push({type:'upgrade',unitId:u.id,into:i.into}); continue; }
      const threatened=units.filter(u=>Plan.canDefend(g,pid,plan,u.id) && Hex.range([u.q,u.r],2).some(([q,r])=>Plan.knownEnemyAt(g,pid,Hex.key(q,r))));
      if(threatened.length && Math.random()<0.3){ plan.push({type:'defend',unitId:pick(threatened).id}); continue; }
      if(Math.random()<0.8){
        const cand=[]; units.forEach(au=>Plan.attackTargets(g,pid,plan,au.id).forEach(k=>cand.push([au,k])));
        if(cand.length){ const [au,k]=pick(cand); plan.push({type:'attack',unitId:au.id,target:Plan.attackTargetAt(g,pid,k),at:Hex.parse(k),from:Plan.positions(g,pid,plan).get(au.id)}); continue; }
      }
      const movers=units.filter(x=>!Plan.movesBuilder(g,plan,x.id)); if(!movers.length) continue;
      const u=pick(movers), from=Plan.positions(g,pid,plan).get(u.id);
      const targets=Plan.moveTargets(g,pid,plan,u.id).map(Hex.parse);
      if(!targets.length) continue;
      let to;
      let goal=[0,0];
      if(Rules.canBuild(u)){ const free=(g.resources||[]).map(Hex.parse).filter(c=>!Game.buildingAt(g,Hex.key(c[0],c[1])));
        if(free.length){ free.sort((a,b)=>Hex.dist(a,from)-Hex.dist(b,from)); goal=free[0]; } }
      if(Math.random()<0.75){ targets.sort((a,b)=>Hex.dist(a,goal)-Hex.dist(b,goal)); to=targets[0]; }
      else to=pick(targets);
      plan.push({type:'move',unitId:u.id,from,to});
    }
    return plan;
  }
};

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rid(){ return Math.random().toString(36).slice(2,10); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function storeDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* 게임 생성·진행 공용 규칙 (한 기기와 온라인이 함께 사용) */
const Setup = {
  createGame(seats,aiLevel){
    const g={ aiLevel:aiLevel||'normal', board:Board.create(CONFIG.boardRadius), units:[], nextUnitId:1, buildings:[], nextBuildingId:1, turn:0, phase:'civ', centerEffect:null, plans:{}, log:[], scouts:[],
      players:seats.map((s,i)=>({id:i,name:(s.name||'').trim()||`플레이어 ${i+1}`,type:s.type,uid:s.uid||null,color:PLAYER_COLORS[i],
        civ:null,points:CONFIG.startPoints,reserve:{},explored:new Set(),visible:new Set(),centerActive:false,
        absent:s.type==='none', eliminated:s.type==='none'})) };
    g.players.filter(p=>p.type==='ai'||p.absent).forEach(p=>p.civ=AI.pickCiv());
    return g;
  },
  aiSetupAll(g){ g.players.filter(p=>p.type==='ai').forEach(p=>AI.setup(g,p.id)); },
  applyPlacement(g,pid,list,hq){
    const p=g.players[pid];
    g.units=g.units.filter(u=>u.owner!==pid);
    g.buildings=g.buildings.filter(b=>b.owner!==pid);
    if(hq) Purchase.placeHQ(g,pid,Hex.key(Math.trunc(Number(hq.q)),Math.trunc(Number(hq.r))));
    p.reserve={}; p.points=CONFIG.startPoints;
    const used=new Set();
    for(const it of (Array.isArray(list)?list:[]).slice(0,100)){
      const t=UNITS[it&&it.type], q=Math.trunc(Number(it&&it.q)), r=Math.trunc(Number(it&&it.r)), k=Hex.key(q,r), tile=g.board.tiles.get(k);
      if(!t || t.purchasable===false || (t.civ && t.civ!==p.civ) || !tile || tile.zoneOwner!==pid || used.has(k) || p.points<t.cost) continue;
      p.points-=t.cost; used.add(k);
      if(Game.buildingAt(g,k)) continue;
      Game.newUnit(g,pid,t.id,q,r);
    }
    Purchase.autoHQ(g,pid);
  },
  sanitizePlan(g,pid,actions){
    const out=[], int=v=>Math.trunc(Number(v)), pt=a=>Array.isArray(a)&&a.length===2?[int(a[0]),int(a[1])]:null;
    for(const a of (Array.isArray(actions)?actions:[]).slice(0,CONFIG.actionsPerTurn)){
      if(!a || !ACTIONS[a.type] || !ACTIONS[a.type].implemented) continue;
      const unitId=int(a.unitId);
      if(a.type==='move' && pt(a.to)) out.push({type:'move',unitId,from:pt(a.from)||[0,0],to:pt(a.to)});
      else if(a.type==='scout') out.push({type:'scout',unitId,at:pt(a.at)});
      else if(a.type==='defend') out.push({type:'defend',unitId});
      else if(a.type==='upgrade' && UNITS[a.into] && UNITS[a.into].upgradeFrom) out.push({type:'upgrade',unitId,into:a.into});
      else if(a.type==='recruit' && UNITS[a.unit] && pt(a.at)) out.push({type:'recruit',buildingId:int(a.buildingId),unit:a.unit,at:pt(a.at)});
      else if(a.type==='build' && BUILDINGS[a.building] && BUILDINGS[a.building].buildable!==false && pt(a.at)) out.push({type:'build',unitId,building:a.building,at:pt(a.at),from:pt(a.from)});
      else if(a.type==='attack' && a.target && (a.target.kind==='unit'||a.target.kind==='building') && pt(a.at)) out.push({type:'attack',unitId,target:{kind:a.target.kind,id:int(a.target.id)},at:pt(a.at),from:pt(a.from)});
    }
    return out;
  },
  begin(g){
    g.phase='game'; g.turn=1;
    CenterZone.roll(g);
    if(!g.resources || !g.resources.length) g.resources = CONFIG.resourceMode==='symmetric' ? Board.rollResources(g.board,CONFIG.resourcePairs) : Board.rollRandomResources(g.board,CONFIG.resourceCount);
    Vision.update(g);
    const ce=g.centerEffect;
    Log.add(g,{pub:`게임 시작. 중앙 특별 구역 효과: ${ce.name} (${ce.kind==='buff'?'버프':'디버프'})`});
  },
  resolveTurn(g){
    Resolver.resolveTurn(g);
    Construction.endTurn(g);
    for(const p of g.players){
      if(p.eliminated) continue;
      const inc=Rules.incomeOf(g,p.id), bi=CONFIG.baseIncome, base=(bi.every>0 && g.turn%bi.every===0)?bi.amount:0;
      if(inc+base>0){ p.points+=inc+base;
        Log.add(g,{slot:null,pid:p.id,priv:`수입 +${inc+base}점 (${[base?`기본 ${base}`:'',inc?`보급소 ${inc}`:''].filter(Boolean).join(' + ')}) · 보유 ${p.points}점`}); }
    }
    CenterZone.endTurn(g);
    g.turn++;
    g.scouts=(g.scouts||[]).filter(sc=>sc.until>=g.turn);
    g.units=g.units.filter(u=>u.alive);
    Vision.update(g);
  },
  serialize(g){
    return { units:g.units, nextUnitId:g.nextUnitId, buildings:g.buildings, nextBuildingId:g.nextBuildingId, turn:g.turn, phase:g.phase,
      aiLevel:g.aiLevel, centerEffectId:g.centerEffect?g.centerEffect.id:null, log:g.log.slice(-200), scouts:g.scouts||[], resources:g.resources||[],
      players:g.players.map(p=>({id:p.id,name:p.name,type:p.type,uid:p.uid,color:p.color,civ:p.civ,points:p.points,reserve:p.reserve,explored:[...p.explored],centerActive:p.centerActive,absent:!!p.absent,eliminated:!!p.eliminated,elimTurn:p.elimTurn||null})), over:g.over||null };
  },
  deserialize(s){
    const g={ board:Board.create(CONFIG.boardRadius), units:s.units.map(u=>Object.assign({},u)), nextUnitId:s.nextUnitId,
      buildings:(s.buildings||[]).map(b=>Object.assign({},b)), nextBuildingId:s.nextBuildingId||1, turn:s.turn, phase:s.phase,
      centerEffect:CENTER_EFFECTS.find(e=>e.id===s.centerEffectId)||null, plans:{}, log:s.log.map(e=>Object.assign({},e)), scouts:(s.scouts||[]).map(x=>Object.assign({},x)), resources:(s.resources||[]).slice(),
      over:s.over||null, aiLevel:s.aiLevel||'normal',
      players:s.players.map(p=>Object.assign({},p,{reserve:Object.assign({},p.reserve),explored:new Set(p.explored),visible:new Set()})) };
    if(g.phase==='game') Vision.update(g);
    return g;
  },
  // 한 플레이어에게 보낼 상태: 시야 밖의 상대 기물·건물, 남의 정찰 지역과 비공개 기록은 빼고 보낸다.
  viewState(s,seat){
    const out=clone(s);
    let vis=null;
    if(s.phase==='game') vis=this.deserialize(s).players[seat].visible;
    const see=o=>o.owner===seat || (vis && vis.has(Hex.key(o.q,o.r)));
    out.units=out.units.filter(see);
    out.buildings=(out.buildings||[]).filter(see);
    out.scouts=(out.scouts||[]).filter(x=>x.pid===seat);
    out.log=out.log.filter(e=>e.pid===seat||e.pub).map(e=>e.pid===seat?e:Object.assign({},e,{priv:null}));
    out.players=out.players.map(p=>p.id===seat?p:Object.assign({},p,{explored:[],reserve:{}}));
    return out;
  }
};
