/* WebRTC P2P. 호스트 기기가 규칙을 처리하고, 참가자는 자기 제출만 보낸다.
   연결 방법 두 가지
   - 방 코드: PeerJS 공개 서버를 처음 연결할 때만 쓴다. 게임 데이터는 기기끼리 직접 오간다.
   - 코드 직접 교환: 서버 없이 초대 코드·응답 코드를 복사해서 주고받는다. */

// 큰 메시지를 조각내서 보내고 받아서 다시 합치는 연결 래퍼
function makeLink(rawSend, rawClose){
  const link={ id:rid(), onmsg:null, onclose:null, buf:{}, dead:false,
    send(obj){ if(this.dead) return; const s=JSON.stringify(obj), CH=CONFIG.net.chunk, n=Math.max(1,Math.ceil(s.length/CH)), mid=rid();
      try{ for(let i=0;i<n;i++) rawSend(JSON.stringify({c:mid,i,n,d:s.slice(i*CH,(i+1)*CH)})); }catch(e){ this.closed(); } },
    receive(raw){
      let m; try{ m=JSON.parse(raw); }catch(e){ return; }
      if(!m || !m.c) return;
      const b=this.buf[m.c]||(this.buf[m.c]={n:m.n,parts:[],got:0});
      if(b.parts[m.i]==null){ b.parts[m.i]=m.d; b.got++; }
      if(b.got===b.n){ delete this.buf[m.c]; let o; try{ o=JSON.parse(b.parts.join('')); }catch(e){ return; } if(this.onmsg) this.onmsg(o); }
    },
    closed(){ if(this.dead) return; this.dead=true; if(this.onclose) this.onclose(); },
    close(){ try{ rawClose(); }catch(e){} this.closed(); }
  };
  return link;
}
function wrapPeerConn(conn){
  const link=makeLink(s=>{ if(conn.open) conn.send(s); }, ()=>conn.close());
  conn.on('data',d=>link.receive(typeof d==='string'?d:String(d)));
  conn.on('close',()=>link.closed());
  conn.on('error',()=>link.closed());
  return link;
}
function wrapDC(dc,pc){
  const link=makeLink(s=>{ if(dc.readyState==='open') dc.send(s); }, ()=>{ dc.close(); pc.close(); });
  dc.onmessage=e=>link.receive(e.data);
  dc.onclose=()=>link.closed();
  pc.addEventListener('connectionstatechange',()=>{ if(pc.connectionState==='failed'||pc.connectionState==='closed') link.closed(); });
  return link;
}
let peerLoading=null;
function loadPeerJS(){
  if(window.Peer) return Promise.resolve();
  if(peerLoading) return peerLoading;
  peerLoading=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=CONFIG.net.peerjsUrl; s.async=true;
    s.onload=()=>res(); s.onerror=()=>{ peerLoading=null; rej(new Error('연결 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하거나 코드 직접 교환 방식을 쓰세요.')); };
    document.head.appendChild(s);
  });
  return peerLoading;
}
function peerError(e){
  const t=e&&e.type;
  if(t==='peer-unavailable') return '그 코드의 방이 없거나 호스트가 화면을 닫았습니다.';
  if(t==='unavailable-id') return '이 방 코드가 아직 사용 중입니다. 30초쯤 뒤 다시 시도하세요.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed') return '연결 서버에 닿지 못했습니다. 인터넷 연결을 확인하거나 코드 직접 교환 방식을 쓰세요.';
  if(t==='browser-incompatible') return '이 브라우저는 WebRTC를 지원하지 않습니다.';
  return (e&&e.message)||'연결 오류가 났습니다.';
}
// 연결 정보(SDP)를 짧은 문자열로 압축
const SDP = {
  b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  unb64(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; },
  async pack(desc){
    const bytes=new TextEncoder().encode(JSON.stringify({t:desc.type,s:desc.sdp}));
    if(typeof CompressionStream!=='undefined'){
      try{ const z=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'HXz'+this.b64(new Uint8Array(z)); }catch(e){}
    }
    return 'HXp'+this.b64(bytes);
  },
  async unpack(text){
    const t=String(text||'').replace(/\s+/g,''), kind=t.slice(0,3);
    if(kind!=='HXz' && kind!=='HXp') throw new Error('HEXARIA 연결 코드가 아닙니다. 코드 전체를 복사했는지 확인하세요.');
    let bytes=this.unb64(t.slice(3));
    if(kind==='HXz') bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const o=JSON.parse(new TextDecoder().decode(bytes));
    return {type:o.t,sdp:o.s};
  }
};
async function waitIce(pc){
  if(pc.iceGatheringState==='complete') return;
  await new Promise(res=>{ const t=setTimeout(res,5000); pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } }); });
}

const Net = {
  mode:null, isHost:false, code:null, clientId:null, name:'',
  main:null, hostMain:null, mySeat:-1,
  joins:new Map(), subs:new Map(), links:new Map(), connected:new Set(),
  hostLink:null, peer:null, pending:null, guestPc:null,
  error:'', status:'', linkLost:false,
  init(){
    this.clientId=storeGet('hexaria-client-id');
    if(!this.clientId){ this.clientId='c'+rid()+rid(); storeSet('hexaria-client-id',this.clientId); }
  },
  rtcSupported(){ return typeof RTCPeerConnection!=='undefined'; },
  newCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<5;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; },
  leave(){
    this.links.forEach(e=>{ try{ e.link.close(); }catch(x){} });
    if(this.hostLink) try{ this.hostLink.close(); }catch(x){}
    if(this.pending) try{ this.pending.pc.close(); }catch(x){}
    if(this.guestPc) try{ this.guestPc.close(); }catch(x){}
    if(this.peer) try{ this.peer.destroy(); }catch(x){}
    Object.assign(this,{mode:null,isHost:false,code:null,main:null,hostMain:null,mySeat:-1,joins:new Map(),subs:new Map(),links:new Map(),connected:new Set(),
      hostLink:null,peer:null,pending:null,guestPc:null,error:'',status:'',linkLost:false});
  },
  /* ---------- 호스트 ---------- */
  beginHost(mode,code,name){
    this.mode=mode; this.isHost=true; this.code=code; this.name=name;
    this.hostMain={ mode, code, phase:'lobby', status:{submitted:[]}, state:null,
      seats:[{type:'human',uid:this.clientId,name},{type:'open'},{type:'open'},{type:'open'}] };
    this.publish();
  },
  openHostPeer(code){
    return new Promise((res,rej)=>{
      const peer=new window.Peer(CONFIG.net.peerPrefix+code.toLowerCase(),{config:{iceServers:CONFIG.net.iceServers}});
      let opened=false;
      peer.on('open',()=>{ opened=true; this.peer=peer; res(); });
      peer.on('error',e=>{ if(!opened){ try{ peer.destroy(); }catch(x){} rej(e); } else if(e.type!=='peer-unavailable'){ this.error=peerError(e); render(); } });
      peer.on('connection',conn=>conn.on('open',()=>this.hostAddLink(wrapPeerConn(conn))));
      peer.on('disconnected',()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(x){} });
    });
  },
  async hostRoom(name){
    await loadPeerJS();
    for(let i=0;i<4;i++){
      const code=this.newCode();
      try{ await this.openHostPeer(code); this.beginHost('room',code,name); return; }
      catch(e){ if(e && e.type==='unavailable-id') continue; throw new Error(peerError(e)); }
    }
    throw new Error('방 코드를 만들지 못했습니다. 잠시 뒤 다시 시도하세요.');
  },
  hostManual(name){ this.beginHost('manual','직접',name); },
  async resumeHost(){
    const raw=storeGet('hexaria-host-save'); if(!raw) throw new Error('이어서 열 게임이 없습니다.');
    const s=JSON.parse(raw);
    this.mode=s.mode; this.isHost=true; this.code=s.code; this.hostMain=s.main;
    this.subs=new Map(s.subs||[]); this.joins=new Map(s.joins||[]);
    if(s.mode==='room'){ await loadPeerJS(); try{ await this.openHostPeer(s.code); }catch(e){ throw new Error(peerError(e)); } }
    this.publish();
  },
  save(){ if(this.hostMain) storeSet('hexaria-host-save',JSON.stringify({mode:this.mode,code:this.code,main:this.hostMain,subs:[...this.subs],joins:[...this.joins],at:Date.now()})); },
  async createInvite(){
    const pc=new RTCPeerConnection({iceServers:CONFIG.net.iceServers});
    const dc=pc.createDataChannel('hexaria',{ordered:true});
    const p={pc,dc}; if(this.pending) try{ this.pending.pc.close(); }catch(x){}
    this.pending=p;
    dc.onopen=()=>{ this.hostAddLink(wrapDC(dc,pc)); if(this.pending===p) this.pending=null; UI.inviteCode=''; UI.answerInput=''; this.status='참가자가 연결되었습니다.'; render(); };
    await pc.setLocalDescription(await pc.createOffer());
    await waitIce(pc);
    UI.inviteCode=await SDP.pack(pc.localDescription);
    this.status='초대 코드를 참가자에게 보내고, 받은 응답 코드를 아래에 붙여넣으세요.';
  },
  async acceptAnswer(text){
    if(!this.pending) throw new Error('먼저 초대 코드를 만드세요.');
    const d=await SDP.unpack(text);
    if(d.type!=='answer') throw new Error('응답 코드가 아닙니다. 참가자가 만든 응답 코드를 붙여넣으세요.');
    await this.pending.pc.setRemoteDescription(d);
    this.status='연결하는 중입니다…';
  },
  hostAddLink(link){
    const e={link,clientId:null};
    this.links.set(link.id,e);
    link.onmsg=m=>this.hostOnMsg(e,m);
    link.onclose=()=>{ this.links.delete(link.id);
      if(e.clientId && ![...this.links.values()].some(x=>x.clientId===e.clientId)) this.connected.delete(e.clientId);
      this.publish(); };
  },
  hostOnMsg(e,m){
    if(!m || typeof m!=='object') return;
    if(m.t==='hello'){
      const cid=String(m.clientId||'').replace(/[^A-Za-z0-9]/g,'').slice(0,40) || ('x'+rid());
      if(cid===this.clientId) return;
      e.clientId=cid; this.connected.add(cid);
      if(!this.joins.has(cid)) this.joins.set(cid,{name:String(m.name||'').trim().slice(0,12)});
      this.hostTick();
    } else if(m.t==='sub' && e.clientId){
      const part=m.part||{}, cur=this.subs.get(e.clientId)||{};
      ['civ','placement','plan'].forEach(k=>{ if(part[k]!==undefined) cur[k]=part[k]; });
      this.subs.set(e.clientId,cur);
      this.hostTick();
    }
  },
  hostTick(){
    if(!this.isHost || !this.hostMain) return;
    for(let i=0;i<12;i++){ const m=clone(this.hostMain); if(!this.hostStep(m)) break; this.hostMain=m; }
    this.publish();
  },
  viewFor(m,seat){
    const conn=m.seats.map(s=>s.type==='human' && (s.uid===this.clientId || this.connected.has(s.uid)));
    const v=Object.assign({},m,{conn});
    if(m.state) v.state = seat<0 ? null : Setup.viewState(m.state,seat);
    return v;
  },
  publish(){
    if(!this.isHost || !this.hostMain) return;
    this.save();
    const m=this.hostMain;
    for(const e of this.links.values()){
      if(!e.clientId) continue;
      e.link.send({t:'main',main:this.viewFor(m,m.seats.findIndex(s=>s.uid===e.clientId))});
    }
    this.receiveMain(this.viewFor(m,m.seats.findIndex(s=>s.uid===this.clientId)));
  },
  hostSetSeat(i,type){
    const m=clone(this.hostMain);
    if(m.phase!=='lobby' || i===0 || m.seats[i].type==='human') return;
    m.seats[i]= type==='ai' ? {type:'ai',name:`컴퓨터 ${i}`} : type==='none' ? {type:'none'} : {type:'open'};
    this.hostMain=m; this.hostTick();
  },
  hostSetAILevel(l){ const m=clone(this.hostMain); if(m.phase!=='lobby'||!AI_LEVELS[l]) return; m.aiLevel=l; this.hostMain=m; this.hostTick(); },
  hostKick(i){
    const m=clone(this.hostMain);
    if(m.phase!=='lobby' || i===0) return;
    const s=m.seats[i]; if(s.uid){ this.joins.delete(s.uid); }
    m.seats[i]={type:'open'}; this.hostMain=m;
    for(const e of this.links.values()) if(e.clientId===s.uid){ e.link.send({t:'kick'}); }
    this.hostTick();
  },
  hostStart(fillAI){
    const m=clone(this.hostMain);
    if(m.phase!=='lobby') return;
    let n=0;
    m.seats=m.seats.map(s=> s.type==='ai' || (s.type==='open'&&fillAI) ? {type:'ai',name:`컴퓨터 ${++n}`} : s.type==='open' ? {type:'none'} : s);
    if(m.seats.filter(s=>s.type!=='none').length<2){ this.error='플레이어가 최소 2명 있어야 시작할 수 있습니다.'; render(); return; }
    const g=Setup.createGame(m.seats,m.aiLevel||'normal');
    m.phase='civ'; m.status={submitted:[]}; m.state=Setup.serialize(g);
    this.hostMain=m; this.hostTick();
  },
  // 연결이 끊긴 사람 자리를 컴퓨터가 이어받게 함
  hostReplaceWithAI(i){
    const m=clone(this.hostMain);
    if(i===0 || !m.state || m.seats[i].type!=='human') return;
    m.seats[i]={type:'ai',name:`컴퓨터(${m.seats[i].name})`};
    const g=Setup.deserialize(m.state), p=g.players[i];
    p.type='ai'; p.uid=null; p.name=m.seats[i].name;
    if(g.phase==='civ') p.civ=p.civ||AI.pickCiv();
    if(g.phase==='placement'){ if(!p.civ) p.civ=AI.pickCiv(); g.units=g.units.filter(u=>u.owner!==i); p.points=CONFIG.startPoints; p.reserve={}; AI.setup(g,i); }
    m.state=Setup.serialize(g); this.hostMain=m; this.hostTick();
  },
  hostStep(m){
    if(m.phase==='lobby'){
      let ch=false;
      for(const [uid,j] of this.joins){
        if(m.seats.some(s=>s.uid===uid)) continue;
        const free=m.seats.findIndex(s=>s.type==='open'); if(free<0) break;
        m.seats[free]={type:'human',uid,name:(j&&j.name)||`플레이어 ${free+1}`}; ch=true;
      }
      return ch;
    }
    const g=Setup.deserialize(m.state);
    const humans=g.players.filter(p=>p.type==='human');
    const subOf=p=> p.uid===this.clientId ? (this.subs.get(this.clientId)||{}) : (this.subs.get(p.uid)||{});
    const HAS={
      civ:p=>!!CIVS[subOf(p).civ],
      placement:p=>!!subOf(p).placement && Array.isArray(subOf(p).placement.units),
      game:p=>{ if(p.eliminated) return true; const pl=subOf(p).plan; return !!pl && pl.turn===g.turn && Array.isArray(pl.actions); }
    };
    let ch=false;
    if(g.over) return false;
    if(humans.every(HAS[m.phase])){
      if(m.phase==='civ'){
        humans.forEach(p=>p.civ=subOf(p).civ);
        g.phase='placement'; Setup.aiSetupAll(g); m.phase='placement';
      } else if(m.phase==='placement'){
        humans.forEach(p=>Setup.applyPlacement(g,p.id,subOf(p).placement.units,subOf(p).placement.hq));
        Setup.begin(g); m.phase='game';
      } else if(m.phase==='game'){
        g.plans={};
        humans.forEach(p=>g.plans[p.id]=p.eliminated?[]:Setup.sanitizePlan(g,p.id,subOf(p).plan.actions));
        g.players.filter(p=>p.type==='ai').forEach(p=>g.plans[p.id]=AI.plan(g,p.id));
        Setup.resolveTurn(g);
      }
      ch=true;
    }
    const sub=humans.filter(HAS[m.phase]).map(p=>p.id);
    if(JSON.stringify(sub)!==JSON.stringify((m.status&&m.status.submitted)||[])){ m.status={submitted:sub}; ch=true; }
    if(ch) m.state=Setup.serialize(g);
    return ch;
  },
  /* ---------- 참가자 ---------- */
  async joinRoom(code,name){
    code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code.length!==5) throw new Error('방 코드 5자리를 확인해 주세요.');
    await loadPeerJS();
    const peer=new window.Peer({config:{iceServers:CONFIG.net.iceServers}});
    await new Promise((res,rej)=>{ peer.on('open',res); peer.on('error',e=>rej(new Error(peerError(e)))); });
    this.peer=peer;
    const conn=peer.connect(CONFIG.net.peerPrefix+code.toLowerCase(),{reliable:true,serialization:'raw'});
    await new Promise((res,rej)=>{
      const t=setTimeout(()=>rej(new Error('호스트에 연결하지 못했습니다. 코드를 확인하거나 잠시 뒤 다시 시도하세요.')),15000);
      conn.on('open',()=>{ clearTimeout(t); res(); });
      peer.on('error',e=>{ clearTimeout(t); rej(new Error(peerError(e))); });
    });
    this.mode='room'; this.code=code;
    this.clientAttach(wrapPeerConn(conn),name);
  },
  async answerInvite(text,name){
    const d=await SDP.unpack(text);
    if(d.type!=='offer') throw new Error('초대 코드가 아닙니다. 호스트가 만든 초대 코드를 붙여넣으세요.');
    const pc=new RTCPeerConnection({iceServers:CONFIG.net.iceServers});
    this.guestPc=pc;
    pc.ondatachannel=ev=>{ const dc=ev.channel; const go=()=>{ this.mode='manual'; this.code='직접'; this.clientAttach(wrapDC(dc,pc),name); };
      if(dc.readyState==='open') go(); else dc.onopen=go; };
    await pc.setRemoteDescription(d);
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    UI.answerCode=await SDP.pack(pc.localDescription);
  },
  clientAttach(link,name){
    this.hostLink=link; this.isHost=false; this.name=name; this.linkLost=false; this.error='';
    link.onmsg=m=>{
      if(m.t==='main') this.receiveMain(m.main);
      else if(m.t==='kick'){ this.error='호스트가 대기실에서 내보냈습니다.'; this.linkLost=true; render(); }
    };
    link.onclose=()=>{ this.linkLost=true; render(); };
    link.send({t:'hello',clientId:this.clientId,name});
    UI.online=true; UI.screen='lobby'; render();
  },
  receiveMain(d){
    this.main=d;
    this.mySeat=d.seats.findIndex(s=>s.uid===this.clientId);
    applyOnline(d);
  },
  submit(part){
    if(this.isHost){
      const cur=this.subs.get(this.clientId)||{}; Object.assign(cur,part); this.subs.set(this.clientId,cur);
      this.hostTick(); return;
    }
    if(!this.hostLink || this.linkLost){ this.error='호스트와 연결이 끊겨 제출하지 못했습니다.'; UI.submittedLocal=null; render(); return; }
    this.hostLink.send({t:'sub',part});
  }
};

// 받은 게임 문서로 이 기기의 화면을 갱신
function applyOnline(d){
  UI.online=true;
  const me=Net.mySeat;
  if(d.phase==='lobby' || me<0 || !d.state){ G=null; UI.screen='lobby'; render(); return; }
  let draft=null;
  if(G && G.phase==='placement' && d.phase==='placement' && !isWaiting()){
    const p=G.players[me]; draft={points:p.points,reserve:Object.assign({},p.reserve),units:Game.unitsOf(G,me).map(u=>Object.assign({},u)),hq:(h=>h?Object.assign({},h):null)(Purchase.hqOf(G,me))};
  }
  const prevPhase=G?G.phase:null;
  G=Setup.deserialize(d.state);
  UI.viewer=me;
  if(draft){ const p=G.players[me]; p.points=draft.points; p.reserve=draft.reserve; G.units=G.units.filter(u=>u.owner!==me).concat(draft.units); G.nextUnitId=Math.max(G.nextUnitId,...draft.units.map(u=>u.id+1),1);
    G.buildings=G.buildings.filter(b=>b.owner!==me); if(draft.hq){ G.buildings.push(draft.hq); G.nextBuildingId=Math.max(G.nextBuildingId,draft.hq.id+1); } }
  if(d.phase==='civ') UI.screen='civ';
  else if(d.phase==='placement'){ if(prevPhase!=='placement'){ UI.selReserve=null; UI.selUnit=null; setHint('상점에서 기물을 구매한 뒤, 강조된 시작 영역의 칸을 눌러 배치하세요.'); } UI.screen='placement'; }
  else if(d.phase==='game'){
    UI.screen='game';
    if(G.over){ if(UI.lastTurn!=='over'){ UI.lastTurn='over'; UI.viewer=me; render(); return showGameOver(); } }
    else if(UI.lastTurn!==G.turn){
      if(UI.lastTurn==null){
        UI.overlay={title:'중앙 특별 구역 효과 공개',btn:'확인',body:centerAnnounceHTML(G.centerEffect)};
        if(G.turn>1){ const res=resultsHTML(me,G.turn-1); if(res) UI.overlay.body+=`<h4>지난 턴 결과</h4>${res}`; }
      } else {
        const res=resultsHTML(me,G.turn-1);
        UI.overlay={title:`턴 ${G.turn-1} 결과`,btn:'다음 턴 계획하기',body:res||'<p class="muted">기록이 없습니다.</p>'};
      }
      UI.lastTurn=G.turn; UI.plan=[]; UI.mode=null; UI.selUnit=null; UI.submittedLocal=null;
      setHint('기물을 누르면 이동(파란 칸)과 공격(빨간 칸)할 수 있는 곳이 표시됩니다.');
    }
  }
  render();
}
function isWaiting(){
  if(G && G.phase==='game' && (G.over || (G.players[UI.viewer]&&G.players[UI.viewer].eliminated))) return true;
  if(!UI.online || !Net.main) return false;
  if(((Net.main.status&&Net.main.status.submitted)||[]).includes(Net.mySeat)) return true;
  const s=UI.submittedLocal;
  return !!s && s.phase===Net.main.phase && s.turn===(G?G.turn:0);
}
function submittedSeats(){
  if(UI.online) return (Net.main&&Net.main.status&&Net.main.status.submitted)||[];
  return G.players.filter(x=>G.plans[x.id]).map(x=>x.id);
}
function centerAnnounceHTML(ce){
  return `<p>이번 게임에서 무작위로 정해진 효과입니다. 모든 플레이어에게 공개됩니다.</p>
    <div class="effect"><b>${esc(ce.name)}</b> <span class="tag">${ce.kind==='buff'?'버프':'디버프'}</span>${ce.sample?' <span class="tag temp">샘플 효과</span>':''}<br><span class="muted small">${esc(ce.desc)}</span></div>
    <p class="small muted">${ce.kind==='buff'?'자신의 기물이 중앙 2칸 중 한 칸에라도 있으면 그 플레이어가 효과를 받습니다.':'누군가의 기물이 중앙 2칸 중 한 칸에라도 있으면, 그 플레이어를 뺀 나머지 모두에게 효과가 걸립니다.'}</p>`;
}

/* =============================== [FLOW] =============================== */
let G=null;
const SETUP={ aiLevel:'normal', seats:[
  {name:'플레이어 1',type:'human'},{name:'플레이어 2',type:'ai'},{name:'플레이어 3',type:'ai'},{name:'플레이어 4',type:'ai'}
]};
const UI={ selBld:null, recruitType:null, selHQ:false, pop:null, online:false, lastTurn:null, submittedLocal:null, netName:'', netCode:'', netBusy:false, onlineTab:'room',
  inviteCode:'', answerInput:'', offerInput:'', answerCode:'', copied:'',
  screen:'menu', viewer:0, queue:[], overlay:null, selCiv:null, selReserve:null, selUnit:null, mode:null, buildType:'tower', plan:[], hint:'', hintWarn:false };

const Flow = {
  multiHuman(){ return Game.humans(G).length>1; },
  newGame(){
    UI.online=false;
    G=Setup.createGame(SETUP.seats,SETUP.aiLevel);
    UI.queue=Game.humans(G).map(p=>p.id);
    this.nextCiv();
  },
  gate(title,body){
    UI.overlay = this.multiHuman() ? {title,body:body||'다른 플레이어는 화면을 보지 않도록 해 주세요.',btn:'시작하기',opaque:true} : null;
    render();
  },
  nextCiv(){
    if(!UI.queue.length) return this.startPlacement();
    UI.viewer=UI.queue.shift(); UI.selCiv=null; UI.screen='civ';
    this.gate(`${G.players[UI.viewer].name} — 문명 선택`);
  },
  startPlacement(){
    G.phase='placement';
    Setup.aiSetupAll(G);
    UI.queue=Game.humans(G).map(p=>p.id);
    this.nextPlacement();
  },
  nextPlacement(){
    if(!UI.queue.length) return this.startGame();
    UI.viewer=UI.queue.shift(); UI.selReserve=null; UI.selUnit=null; UI.screen='placement';
    setHint('상점에서 기물을 구매한 뒤, 강조된 시작 영역의 칸을 눌러 배치하세요.');
    this.gate(`${G.players[UI.viewer].name} — 기물 구매와 배치`,'다른 플레이어의 배치가 보이지 않도록 화면을 넘겨 주세요.');
  },
  startGame(){
    Setup.begin(G);
    UI.screen='game'; UI.viewer=Game.humans(G)[0].id;
    UI.overlay={title:'중앙 특별 구역 효과 공개',opaque:this.multiHuman(),btn:'확인',body:centerAnnounceHTML(G.centerEffect),
      onClose:()=>this.startPlanning()};
    render();
  },
  startPlanning(){
    G.plans={};
    G.players.filter(p=>p.type==='ai').forEach(p=>G.plans[p.id]=AI.plan(G,p.id));
    UI.queue=Game.humans(G).map(p=>p.id);
    this.nextPlanner();
  },
  nextPlanner(){
    if(G.over) return showGameOver();
    UI.queue=UI.queue.filter(id=>!G.players[id].eliminated);
    if(!Game.humans(G).some(p=>!p.eliminated)){
      UI.viewer=Game.humans(G)[0].id; UI.screen='game';
      const res=G.turn>1?resultsHTML(UI.viewer,G.turn-1):'';
      UI.overlay={title:`관전 중 — 턴 ${G.turn}`,btn:'다음 턴 진행',body:`<p class="muted">사람 플레이어가 모두 탈락했습니다. 컴퓨터끼리 남은 게임을 한 턴씩 진행합니다.</p>${res}`,onClose:()=>this.resolve()};
      return render();
    }
    if(!UI.queue.length) return this.resolve();
    UI.viewer=UI.queue.shift(); UI.plan=[]; UI.mode=null; UI.selUnit=null;
    setHint('기물을 누르면 이동(파란 칸)과 공격(빨간 칸)할 수 있는 곳이 표시됩니다.');
    const res = G.turn>1 ? resultsHTML(UI.viewer,G.turn-1) : '';
    if(this.multiHuman()) UI.overlay={title:`턴 ${G.turn} — ${G.players[UI.viewer].name} 차례`,opaque:true,btn:'행동 계획 시작',
      body:`<p class="muted">다른 플레이어는 화면을 보지 않도록 해 주세요.</p>${res?`<h4>지난 턴 결과</h4>${res}`:''}`};
    else if(res) UI.overlay={title:`턴 ${G.turn-1} 결과`,btn:'다음 턴 계획하기',body:res};
    render();
  },
  submit(){ G.plans[UI.viewer]=UI.plan.slice(); UI.plan=[]; this.nextPlanner(); },
  resolve(){ Setup.resolveTurn(G); if(G.over){ UI.viewer=Game.humans(G)[0].id; return showGameOver(); } this.startPlanning(); }
};

function showGameOver(){
  const o=G.over, w=o.winner>=0?G.players[o.winner]:null;
  const res=resultsHTML(UI.viewer,o.turn);
  UI.screen='game'; UI.mode=null; UI.selUnit=null;
  UI.overlay={title: w?`${w.name} 승리!`:'무승부', btn:'보드 보기',
    body:`<p>${w?`<span class="dot" style="background:${w.color}"></span>${esc(w.name)} (${CIVS[w.civ].name} 문명)만 본진을 지켰습니다.`:'남은 본진이 없습니다.'} 턴 ${o.turn}에 게임이 끝났습니다.</p>${res?`<h4>마지막 턴 기록</h4>${res}`:''}`};
  render();
}
function resultsHTML(viewer,turn){
  const items=G.log.filter(e=>e.turn===turn).map(e=>({e,t:Log.textFor(e,viewer)})).filter(x=>x.t);
  if(!items.length) return '';
  let html='', last=null;
  for(const {e,t} of items){
    if(e.slot!==last){ html+=`<div class="small" style="margin-top:8px"><b>${e.slot?`슬롯 ${e.slot}`:'공통'}</b></div>`; last=e.slot; }
    html+=`<div class="small" style="padding-left:10px">${e.pid!=null?`<span class="dot" style="background:${G.players[e.pid].color}"></span>`:''}${esc(t)}</div>`;
  }
  return html;
}
function setHint(t,warn){ UI.hint=t; UI.hintWarn=!!warn; }

/* ================================ [UI] ================================ */
const $app=document.getElementById('app');
const SIZE=20;

function bar(x,y,w,frac,color){
  return `<rect x="${x-w/2}" y="${y}" width="${w}" height="3.4" rx="1.5" fill="#000" fill-opacity=".45"/><rect x="${x-w/2}" y="${y}" width="${w*Math.max(0,Math.min(1,frac))}" height="3.4" rx="1.5" fill="${color}"/>`;
}

function boardSVG(o){
  const R=CONFIG.boardRadius, w=Math.sqrt(3)*SIZE*(2*R+1)+8, h=SIZE*(3*R+2)+8;
  const p=G.players[o.viewer], inGame=G.phase==='game';
  const parts=[`<svg class="board" viewBox="${-w/2} ${-h/2} ${w} ${h}" role="img" aria-label="육각형 보드 331칸">`,
    `<defs><marker id="arw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--brass)"/></marker></defs>`];
  const ov=[];
  for(const t of G.board.tiles.values()){
    const [x,y]=Hex.toPixel(t.q,t.r,SIZE);
    let cls;
    if(inGame) cls = p.visible.has(t.key)?'vis':(p.explored.has(t.key)?'exp':'unk');
    else cls = t.zoneOwner===o.viewer?'vis':'exp';
    const poly=Hex.polygon(x,y,SIZE*0.97);
    parts.push(`<g class="tile ${cls}" data-k="${t.key}"><polygon class="base" points="${poly}"/></g>`);
    if(t.zoneOwner!=null) ov.push(`<polygon class="ov" points="${poly}" fill="${G.players[t.zoneOwner].color}" fill-opacity="${t.zoneOwner===o.viewer?0.22:0.13}"/>`);
    if(t.center) ov.push(`<polygon class="ov center-mark" points="${Hex.polygon(x,y,SIZE*0.84)}"/>`);
    if(inGame && G.resources && G.resources.includes(t.key) && p.explored.has(t.key)){ const d=SIZE*0.42;
      ov.push(`<polygon class="ov" points="${x},${y-d} ${x+d},${y} ${x},${y+d} ${x-d},${y}" fill="var(--center)" fill-opacity=".85" stroke="var(--tile-edge)" stroke-width="1.2"/>`); }
    if(o.scoutTiles && o.scoutTiles.has(t.key)) ov.push(`<polygon class="ov" points="${Hex.polygon(x,y,SIZE*0.88)}" fill="none" stroke="${p.color}" stroke-width="1.5" stroke-dasharray="2 2.5"/>`);
    if(o.path && o.path.has(t.key)) ov.push(`<polygon class="ov" points="${Hex.polygon(x,y,SIZE*0.7)}" fill="var(--danger)" fill-opacity=".22"/>`);
    if(o.vr && o.vr.has(t.key)) ov.push(`<polygon class="ov vr-mark" points="${Hex.polygon(x,y,SIZE*0.8)}"/>`);
    if(o.atk && o.atk.has(t.key)) ov.push(`<polygon class="ov atk-mark" points="${Hex.polygon(x,y,SIZE*0.78)}"/>`);
    if(o.hl && o.hl.has(t.key)) ov.push(`<polygon class="ov hl-mark" points="${Hex.polygon(x,y,SIZE*0.78)}"/>`);
    if(o.sel===t.key) ov.push(`<polygon class="ov sel-mark" points="${Hex.polygon(x,y,SIZE*0.92)}"/>`);
  }
  parts.push(`<g class="ov">${ov.join('')}</g>`);
  const ar=[];
  (o.arrows||[]).forEach(([a,b])=>{ const [x1,y1]=Hex.toPixel(a[0],a[1],SIZE), [x2,y2]=Hex.toPixel(b[0],b[1],SIZE);
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, k=(L-SIZE*0.6)/L;
    ar.push(`<line x1="${x1}" y1="${y1}" x2="${x1+dx*k}" y2="${y1+dy*k}" stroke="var(--brass)" stroke-width="2.4" marker-end="url(#arw)"/>`); });
  (o.ghosts||[]).forEach(([q,r])=>{ const [x,y]=Hex.toPixel(q,r,SIZE); ar.push(`<circle cx="${x}" cy="${y}" r="${SIZE*0.55}" fill="none" stroke="${p.color}" stroke-width="2" stroke-dasharray="4 3"/>`); });
  (o.defended||[]).forEach(([q,r])=>{ const [x,y]=Hex.toPixel(q,r,SIZE); ar.push(`<circle cx="${x}" cy="${y}" r="${SIZE*0.8}" fill="none" stroke="var(--hl)" stroke-width="3"/>`); });
  (o.plannedRecruits||[]).forEach(a=>{ const [x,y]=Hex.toPixel(a.at[0],a.at[1],SIZE); ar.push(`<circle cx="${x}" cy="${y}" r="${SIZE*0.58}" fill="none" stroke="${p.color}" stroke-width="2" stroke-dasharray="4 3"/><text class="unit-label" x="${x}" y="${y}" style="fill:${p.color}">${UNITS[a.unit].short}</text>`); });
  (o.plannedBuilds||[]).forEach(a=>{ const [x,y]=Hex.toPixel(a.at[0],a.at[1],SIZE); ar.push(`<rect x="${x-SIZE*0.55}" y="${y-SIZE*0.55}" width="${SIZE*1.1}" height="${SIZE*1.1}" rx="3" fill="none" stroke="${p.color}" stroke-width="2" stroke-dasharray="4 3"/><text class="unit-label" x="${x}" y="${y}" style="fill:${p.color}">${BUILDINGS[a.building].short}</text>`); });
  if(inGame) Vision.activeScouts(G,o.viewer).forEach(sc=>{ const [x,y]=Hex.toPixel(sc.q,sc.r,SIZE);
    ar.push(`<g><ellipse cx="${x}" cy="${y}" rx="${SIZE*0.55}" ry="${SIZE*0.32}" fill="var(--surface)" stroke="${p.color}" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="${SIZE*0.17}" fill="${p.color}"/></g>`); });
  parts.push(`<g class="ov">${ar.join('')}</g>`);
  const us=[];
  for(const b of (G.buildings||[])){
    const k=Hex.key(b.q,b.r), mine=b.owner===o.viewer;
    if(!mine && !(inGame && p.visible.has(k))) continue;
    const [x,y]=Hex.toPixel(b.q,b.r,SIZE), c=G.players[b.owner].color, s=SIZE*0.62;
    if(b.done===false){
      us.push(`<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="3" fill="${c}" fill-opacity=".35" stroke="${c}" stroke-width="2" stroke-dasharray="3 2.5"/>`);
      us.push(`<text class="unit-label" x="${x}" y="${y-1}" style="fill:var(--text)">${BUILDINGS[b.type].short}</text>`);
      us.push(`<text x="${x+s}" y="${y-s+2}" font-size="8" font-weight="700" text-anchor="middle" fill="var(--text)">${Math.max(0,b.completeAt-G.turn+1)}</text>`);
      us.push(bar(x,y+s-5,s*1.6,b.dur/b.max,'#f2d38a'));
      continue;
    }
    us.push(`<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="3" fill="${c}" stroke="${mine?'#fff':'#000'}" stroke-opacity=".7" stroke-width="1.6"/>`);
    us.push(`<text class="unit-label" x="${x}" y="${y-1}">${BUILDINGS[b.type].short}</text>`);
    us.push(bar(x,y+s-5,s*1.6,b.dur/b.max,'#f2d38a'));
  }
  for(const u of G.units){
    if(!u.alive) continue;
    const k=Hex.key(u.q,u.r), mine=u.owner===o.viewer;
    if(!mine && !(inGame && p.visible.has(k))) continue;
    const [x,y]=Hex.toPixel(u.q,u.r,SIZE), c=G.players[u.owner].color;
    us.push(`<circle cx="${x}" cy="${y}" r="${SIZE*0.6}" fill="${c}" stroke="${mine?'#fff':'#000'}" stroke-opacity="${mine?0.9:0.5}" stroke-width="1.6"/>`);
    us.push(`<text class="unit-label" x="${x}" y="${y-1}">${UNITS[u.type].short}</text>`);
    if(inGame) us.push(bar(x,y+SIZE*0.34,SIZE*0.9,u.hp/Rules.maxHp(u),'#8fe39b'));
  }
  parts.push(`<g class="ov">${us.join('')}</g></svg>`);
  return parts.join('');
}

function legendHTML(inGame){

    ${inGame?`<span><i style="background:var(--tile-vis)"></i>현재 시야</span><span><i style="background:var(--tile-exp)"></i>확인했던 지역</span><span><i style="background:var(--tile-unk)"></i>확인하지 못한 지역</span>`:''}
    <span><i style="background:var(--center)"></i>중앙 특별 구역</span>${inGame?'<span>◆ 자원 칸 (보급소 자리)</span>':''}
    <span><i style="border:1.5px dashed var(--hl);background:transparent"></i>선택한 기물의 기본 시야</span>
    ${inGame?`<span>원 = 기물(초록 막대 체력), 네모 = 건물(노란 막대 내구도)</span><span>눈 표시와 점선 칸 = 정찰 지역 (${CONFIG.scoutVision}칸, ${CONFIG.scoutDuration}턴 유지)</span><span><i style="background:var(--hl);opacity:.6"></i>이동할 수 있는 칸</span><span><i style="background:var(--danger);opacity:.6"></i>공격할 수 있는 상대 · 돌격 경로</span>`:''}
  </div>`;
}

function topbar(extra){
  return `<div class="topbar"><span class="wordmark">HEXARIA</span>${extra||''}<span class="spacer"></span><button class="btn small ghost" data-act="quit">메인으로</button></div>`;
}

function viewMenu(){
  const LC=[[0,-2],[2,-2],[0,2],[-2,2]], logo=[];
  for(const [q,r] of Hex.range([0,0],2)){ const [x,y]=Hex.toPixel(q,r,11);
    const ci=LC.findIndex(c=>c[0]===q&&c[1]===r);
    const fill = (q===0&&r===0) ? 'var(--center)' : (ci>=0 ? PLAYER_COLORS[ci] : 'var(--tile-vis)');
    logo.push(`<polygon points="${Hex.polygon(x,y,10.4)}" fill="${fill}" stroke="var(--bg)" stroke-width="1.5"/>`); }
  let save=null; try{ save=JSON.parse(storeGet('hexaria-host-save')||'null'); }catch(e){}
  const canResume = save && save.main && save.main.phase!=='lobby';
  return `<div class="menu"><div class="menu-inner">
    <svg viewBox="-60 -52 120 104" width="132" aria-hidden="true">${logo.join('')}</svg>
    <h1 class="wordmark">HEXARIA</h1>
    <p class="sub">헥사리아 · 네 문명이 겨루는 육각 전략 보드게임</p>
    <div class="menu-btns">
      <button class="btn primary" data-act="go" data-to="start">한 기기로 시작</button>
      <button class="btn" data-act="go" data-to="online">온라인 게임 (다른 기기와 함께)</button>
      ${canResume?`<button class="btn" data-act="net-resume">호스트하던 게임 다시 열기 (턴 ${save.main.state?save.main.state.turn:0})</button>`:''}
      <button class="btn" data-act="go" data-to="rules">게임 규칙</button>
      <button class="btn" data-act="go" data-to="settings">게임 설정</button>
    </div>
    ${Net.error&&UI.screen==='menu'?`<p class="hint warn">${esc(Net.error)}</p>`:''}
    <p class="note">프로토타입입니다. 강화와 자원 시스템은 아직 없습니다.</p>
  </div></div>`;
}

      <div class="muted" style="margin-top:6px">값은 코드 상단 CONFIG 에서 바꿀 수 있습니다.</div></div>

function statCell(u,s){
  let v=u.stats[s];
  if(s==='vision' && v==null) v=CONFIG.baseVision;
  if(s==='move' && v==null && !u.moveStyle) return `${CONFIG.temp.defaultMoveRange} <span class="tag temp">임시</span>`;
  if(v==null) return '<span class="muted">미정</span>';
  return `${v}${(u.temp||[]).includes(s)?' <span class="tag temp">임시</span>':''}`;
}

function viewRules(){
  return `${topbar()}<div class="page">
    <div class="page-head"><h2>게임 규칙</h2><button class="btn" data-act="go" data-to="menu">돌아가기</button></div>
    <div class="box">
      <p>4명이 각자 문명을 골라 반지름 ${CONFIG.boardRadius}칸, 331칸 육각형 보드에서 개인전으로 겨룹니다.</p>
      <ul class="plain">
        <li>시작 전 ${CONFIG.startPoints} 포인트로 기물을 사서 자신의 시작 영역에 자유롭게 배치합니다. 남은 포인트는 건물을 짓는 데 씁니다.</li>
        <li>매 턴 모든 플레이어가 행동 ${CONFIG.actionsPerTurn}개를 몰래 제출합니다. 같은 행동을 여러 번 골라도 됩니다.</li>
        <li>모두 제출하면 1번, 2번, 3번 슬롯 순서로 처리합니다. 같은 슬롯의 행동은 모든 플레이어가 동시에 공개·판정되며, 누구의 행동도 먼저 실행되지 않습니다.</li>
        <li>모든 기물의 기본 시야는 ${CONFIG.baseVision}칸입니다. 정찰을 쓰면 그 기물이 서 있던 자리 주변 ${CONFIG.scoutVision}칸이 보입니다. 정찰 지역은 그 자리에 고정되어 기물이 떠나도 남고, 다음 턴이 끝나면 사라집니다.</li>
        <li>기병은 따로 공격하지 않고 이동으로 돌격합니다. 한 방향 직선으로 최대 3칸 움직이며, 길에 있는 상대 기물을 뚫고 지나가면서 피해를 줍니다. 상대 건물에 부딪히면 그 앞에서 멈추고 건물에 피해를 줍니다. 자기 기물은 지나갈 수 있지만 자기 건물은 지나갈 수 없습니다.</li>
        <li>보병은 1칸 안의 상대에게 피해 2, 수호병은 1칸 안의 상대에게 피해 1을 주는 공격을 할 수 있습니다. 상대 건물도 공격할 수 있습니다. 같은 슬롯에서는 공격이 이동보다 먼저 판정됩니다.</li>
        <li>체력이 0이 된 기물은 쓰러지고, 내구도가 0이 된 건물은 파괴됩니다.</li>
        <li><b>승리 조건:</b> 각자 배치 단계에서 시작 영역에 본진(내구도 15)을 하나 놓습니다. 본진이 파괴되면 그 플레이어는 기물·건물과 함께 탈락하고, 마지막까지 본진이 남은 플레이어가 승리합니다.</li>
        <li><b>방어:</b> 방어 카드를 쓴 기물은 그 턴 동안, 방어 카드의 순서(1·2·3)와 다른 순서에 들어온 공격·돌격 피해를 받지 않습니다. 방어 카드와 같은 순서의 공격이면 공격한 기물이 그 피해를 그대로 받습니다.</li>
        <li><b>문명 전용 기물(★):</b> 처음에는 살 수 없습니다. 기술병이 문명 전용 건물(텍 공학 연구소, 파트 투기장, 람 훈련소, 벨로 정찰 기지)을 지으면, 그 건물 바로 옆에 있는 보병을 강화 행동으로 특수 기물(포격기, 광전사, 정예병, 척후병)로 바꿀 수 있습니다.</li>
        <li><b>모집:</b> 게임 중에도 기물을 늘릴 수 있습니다. 본진이나 병영을 누르고 기물을 고른 뒤, 그 건물 바로 옆 빈 칸을 누르면 그 자리에 소환됩니다. 건물 하나당 턴마다 1번이며 기물 값만큼 포인트를 씁니다.</li>
        <li><b>포인트 수입:</b> 탈락하지 않은 플레이어는 ${CONFIG.baseIncome.every}턴마다 기본으로 ${CONFIG.baseIncome.amount}점을 얻습니다 (턴 ${CONFIG.baseIncome.every}, ${CONFIG.baseIncome.every*2}, … 이 끝날 때). 또한 보드 곳곳의 자원 칸(◆) 위에 기술병이 보급소를 지으면, 완공 후 매 턴이 끝날 때 보급소 하나당 포인트 +1을 얻습니다. 상대 보급소를 파괴해 수입을 끊을 수 있습니다.</li>
        <li>건물은 기술병만 지을 수 있습니다. 기술병 바로 옆 빈 칸에 공사를 시작하고, 시작한 턴 뒤로 2턴이 끝날 때까지 기술병이 움직이지 않으면 완공됩니다. 그 사이 기술병이 움직이거나 쓰러지면 공사는 취소되고 비용을 돌려받습니다.</li>
        <li> 모든 건물은 칸을 막아서, 어떤 기물도 건물 칸을 지나가거나 멈출 수 없습니다.</li>
        <li>보드 중앙 2칸은 특별 구역입니다. 게임마다 효과가 무작위로 정해져 공개되고, 자신의 기물이 그곳에 있으면 효과가 적용됩니다. 버프는 점령한 플레이어가 받고, 디버프는 점령한 플레이어를 뺀 나머지 모두에게 걸립니다.</li>
      </ul>
    </div>
    <h3>문명</h3>
    <div class="box tbl"><table><tr><th>문명</th><th>성격</th><th>특징</th><th>구체적 능력</th></tr>
      ${Object.values(CIVS).map(c=>`<tr><td><b>${c.sym} ${c.name}</b></td><td>${c.theme}</td><td>${c.traits.join(', ')}</td><td><span class="tag wip">미확정</span></td></tr>`).join('')}</table></div>
    <h3>기물</h3>
    <div class="box tbl"><table><tr><th>기물</th><th>문명</th><th>포인트</th>${Object.values(STAT_LABELS).map(l=>`<th>${l}</th>`).join('')}<th>특수 능력</th></tr>
      ${Object.values(UNITS).map(u=>`<tr><td><b>${u.civ?'★ ':''}${u.name}</b></td><td>${u.civ?CIVS[u.civ].name:'공통'}</td><td>${u.upgradeFrom?`강화 ${u.upgradeCost}점`:u.cost+'점'}</td>${Object.keys(STAT_LABELS).map(s=>`<td>${statCell(u,s)}</td>`).join('')}<td>${u.abilities.length?esc(u.abilities.join(' '))+(u.chargeDamage?` (피해 ${u.chargeDamage})`:''):'<span class="muted">미정</span>'}</td></tr>`).join('')}</table></div>
    <h3>건물</h3>
    <div class="box tbl"><table><tr><th>건물</th><th>비용</th><th>내구도</th><th>시야</th><th>설명</th></tr>
      ${Object.values(BUILDINGS).map(b=>`<tr><td><b>${b.name}</b></td><td>${b.cost}점</td><td>${b.durability}</td><td>${b.vision?b.vision+'칸':'없음'}</td><td>${b.civ?`<b>${CIVS[b.civ].name} 전용.</b> `:''}${b.desc}${b.id==='hq'?'':' <span class="tag temp">수치 임시</span>'}</td></tr>`).join('')}</table></div>
    <h3>행동</h3>
    <div class="box tbl"><table><tr><th>행동</th><th>상태</th><th>설명</th></tr>
      ${Object.values(ACTIONS).map(a=>`<tr><td>${a.icon} ${a.name}</td><td>${a.implemented?'<span class="tag">사용 가능</span>':'<span class="tag wip">미구현</span>'}</td><td>${a.desc}</td></tr>`).join('')}</table></div>
    <h3>중앙 특별 구역 효과 후보</h3>
    <div class="box tbl"><table><tr><th>효과</th><th>종류</th><th>설명</th></tr>
      ${CENTER_EFFECTS.map(e=>`<tr><td>${e.name} <span class="tag temp">수치 임시</span></td><td>${e.kind==='buff'?'버프':'디버프'}</td><td>${e.desc}</td></tr>`).join('')}</table></div>
    <h3>임시 규칙</h3>
    <div class="box"><p class="small muted" style="margin-top:0">확정되지 않은 부분을 게임이 돌아가게 하려고 둔 규칙입니다. 데이터(UNITS, BUILDINGS, CONFIG)와 Collision 모듈에서 바꿀 수 있습니다.</p>
      <ul class="plain">${TEMP_RULES.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <h3>미구현 항목</h3>
    <div class="box"><ul class="plain">${UNIMPLEMENTED.map(([a,b])=>`<li><b>${a}</b>${b?` <span class="muted">— ${b}</span>`:''}</li>`).join('')}</ul></div>
  </div>`;
}

function viewPlacement(){
  const p=G.players[UI.viewer];
  const selU = UI.selUnit!=null ? Game.unit(G,UI.selUnit) : null;
  const hq=Purchase.hqOf(G,p.id), selHQ=UI.selHQ && hq;
  const hl=new Set();
  if((UI.selReserve || selU || selHQ) && !isWaiting()) Board.zoneTiles(G.board,p.id).forEach(k=>{ if(Purchase.canPlaceAt(G,p.id,k)) hl.add(k); });
  const mine=Game.unitsOf(G,p.id), resN=Purchase.reserveCount(p), wait=isWaiting();
  if(UI.pop && !wait) hl.add(UI.pop.k);
  const board=boardSVG({viewer:p.id,hl,sel:selU?Hex.key(selU.q,selU.r):(selHQ?Hex.key(hq.q,hq.r):(UI.pop?UI.pop.k:null))});
  const ready=resN===0&&mine.length>0&&!!hq&&!wait;
  const hud=`<div class="hud"><span>남은 포인트 <span class="pts">${p.points}</span>/${CONFIG.startPoints}</span><span class="muted">배치 ${mine.length}개${resN?` · 대기 ${resN}개`:''}</span>
    <span class="${hq?'muted':''}" style="${hq?'':'color:var(--danger);font-weight:700'}">${hq?'본진 ✓':'본진을 놓으세요'}</span><span class="spacer"></span>
    ${(resN||!hq)&&!wait?'<button class="btn small" data-act="auto-place">자동 배치</button>':''}
    <button class="btn small primary" data-act="place-done" ${ready?'':'disabled'}>${wait?'제출 완료':'배치 완료'}</button></div>`;
  let pop='';
  if(!wait && selHQ) pop=popHTML(Hex.key(hq.q,hq.r),`본진 (${hq.q},${hq.r}) · 내구도 ${BUILDINGS.hq.durability}`,'시작 영역의 빈 칸을 누르면 본진을 옮깁니다. 파괴되면 탈락합니다.','<button class="btn ghost" data-act="deselect">닫기</button>');
  else
  if(!wait && selU) pop=popHTML(Hex.key(selU.q,selU.r),`${UNITS[selU.type].name} (${selU.q},${selU.r})`,'시작 영역의 빈 칸을 누르면 그 칸으로 옮깁니다.',
    `<button class="btn danger" data-act="sell-unit">판매 (+${UNITS[selU.type].cost}점)</button><button class="btn" data-act="unplace">배치 대기로</button><button class="btn ghost" data-act="deselect">닫기</button>`);
  else if(!wait && UI.pop) pop=popHTML(UI.pop.k,'이 칸에 배치',`남은 포인트 ${p.points}점`,
    (hq?'':'<button class="btn primary" data-act="quick-hq">본진 놓기</button>')+Rules.unitsFor(p.civ).map(u=>{ const rv=p.reserve[u.id]||0; return `<button class="btn" data-act="quick-place" data-type="${u.id}" ${rv||p.points>=u.cost?'':'disabled'}>${u.civ?'★ ':''}${u.name} ${rv?`(대기 ${rv})`:`${u.cost}점`}</button>`; }).join('')+'<button class="btn ghost" data-act="pop-close">닫기</button>');
  return `${topbar(`<span><span class="dot" style="background:${p.color}"></span>${esc(p.name)} · ${CIVS[p.civ].name} 문명</span><span class="muted">기물 구매와 배치</span>`)}
  <div class="layout">
    <div class="board-wrap">${hud}${board}${pop}${legendHTML(false)}</div>
    <div class="side">
      ${onlineBanner()}
      ${wait?'<div class="banner">배치를 제출했습니다. 다른 플레이어를 기다리는 중입니다.</div>':''}
      <div class="panel"><h4>남은 기물 포인트</h4><div class="big">${p.points} <span class="muted small">/ ${CONFIG.startPoints}</span></div>
        <div class="small muted">남은 포인트는 게임 중 건물을 짓는 데 쓸 수 있습니다.</div></div>
      <div class="panel"><h4>기물 구매</h4>
        ${Rules.unitsFor(p.civ).map(u=>`<div class="row"><span><b>${u.civ?'★ ':''}${u.name}</b> <span class="muted small">${u.cost}점 · 체력 ${u.stats.hp}${u.stats.atk?` · 피해 ${u.stats.atk}`:''}${u.stats.range>1?` · 사거리 ${u.stats.range}`:''}${u.stats.move?` · 이동 ${u.stats.move}칸`:''}${u.moveStyle==='charge'?' · 돌격':''}${u.canBuild?' · 건설':''}</span></span>
          <button class="btn small" data-act="buy" data-type="${u.id}" ${p.points<u.cost||wait?'disabled':''}>구매</button></div>`).join('')}
      </div>
      <div class="panel"><h4>배치 대기 <span class="tag">${resN}개</span></h4>
        ${resN?Object.keys(p.reserve).filter(t=>p.reserve[t]>0).map(t=>`<div class="row"><span>${UNITS[t].name} × ${p.reserve[t]}</span>
          <span><button class="btn small ${UI.selReserve===t?'active':''}" data-act="sel-reserve" data-type="${t}">배치하기</button>
          <button class="btn small ghost danger" data-act="sell-reserve" data-type="${t}" aria-label="${UNITS[t].name} 1개 환불">환불</button></span></div>`).join('')
          :'<div class="muted small">구매한 기물이 여기에 쌓입니다.</div>'}
        ${resN?'<button class="btn small" data-act="auto-place" style="margin-top:8px">남은 기물 자동 배치</button>':''}
      </div>
      ${selU&&!wait?`<div class="panel"><h4>선택한 기물</h4><div>${UNITS[selU.type].name} (${selU.q},${selU.r})</div>
        <div class="small muted">시작 영역의 빈 칸을 누르면 그 칸으로 옮깁니다.</div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn small" data-act="unplace">배치 대기로</button><button class="btn small danger" data-act="sell-unit">판매 (${UNITS[selU.type].cost}점 환불)</button><button class="btn small ghost" data-act="deselect">선택 해제</button></div></div>`:''}
      <div class="panel"><h4>배치한 기물 <span class="tag">${mine.length}개</span></h4>
        <div class="small muted">${Rules.unitsFor(p.civ).map(u=>`${u.name} ${mine.filter(x=>x.type===u.id).length}`).join(' · ')}</div>
        <p class="hint ${UI.hintWarn?'warn':''}">${esc(UI.hint)}</p>
        <button class="btn primary" data-act="place-done" style="width:100%;margin-top:6px" ${(resN===0&&mine.length>0&&!wait)?'':'disabled'}>${wait?'제출 완료':'배치 완료'}</button>
        ${resN?'<div class="small muted" style="margin-top:6px">구매한 기물을 모두 배치해야 완료할 수 있습니다.</div>':''}
        ${!hq?'<div class="small" style="margin-top:6px;color:var(--danger)">본진을 시작 영역에 놓아야 완료할 수 있습니다. 빈 칸을 누르고 본진 놓기를 고르세요.</div>':''}
      </div>
    </div>
  </div>`;
}

function viewGame(){
  const p=G.players[UI.viewer];
  const pos=Plan.positions(G,p.id,UI.plan);
  const selU=UI.selUnit!=null?Game.unit(G,UI.selUnit):null;
  let hl=new Set(), vr=new Set(), path=new Set();
  const ownKeys=()=>Game.unitsOf(G,p.id).forEach(u=>{ const c=pos.get(u.id); hl.add(Hex.key(c[0],c[1])); });
  if(UI.mode==='move'){ if(selU) hl=new Set(Plan.moveTargets(G,p.id,UI.plan,selU.id)); else ownKeys(); }
  if(UI.mode==='build'){ if(selU&&Plan.canPlanBuild(G,p.id,UI.plan,selU.id)) hl=new Set(Plan.buildTargets(G,p.id,UI.plan,selU.id,UI.buildType)); else Game.unitsOf(G,p.id).filter(u=>Plan.canPlanBuild(G,p.id,UI.plan,u.id)).forEach(u=>{ const c=pos.get(u.id); hl.add(Hex.key(c[0],c[1])); }); }
  let atk=new Set();
  if(!UI.mode && selU && !isWaiting() && UI.plan.length<CONFIG.actionsPerTurn){ hl=new Set(Plan.moveTargets(G,p.id,UI.plan,selU.id)); atk=new Set(Plan.attackTargets(G,p.id,UI.plan,selU.id)); }
  if(UI.mode==='attack'){ if(selU) atk=new Set(Plan.attackTargets(G,p.id,UI.plan,selU.id)); else Game.unitsOf(G,p.id).filter(u=>Plan.attackTargets(G,p.id,UI.plan,u.id).length).forEach(u=>{ const c=pos.get(u.id); hl.add(Hex.key(c[0],c[1])); }); }
  if(UI.mode==='upgrade') Game.unitsOf(G,p.id).filter(u=>{ const i=Plan.upgradeInfo(G,p.id,UI.plan,u.id); return i&&i.affordable; }).forEach(u=>{ const c=pos.get(u.id); hl.add(Hex.key(c[0],c[1])); });
  const selB = UI.selBld!=null ? (G.buildings||[]).find(b=>b.id===UI.selBld && b.owner===p.id) : null;
  if(UI.mode==='recruit'){ if(selB && UI.recruitType) hl=new Set(Plan.recruitTargets(G,p.id,UI.plan,selB.id)); else (G.buildings||[]).filter(b=>Plan.canRecruitFrom(G,p.id,UI.plan,b.id)).forEach(b=>hl.add(Hex.key(b.q,b.r))); }
  if(UI.mode==='defend') Game.unitsOf(G,p.id).filter(u=>Plan.canDefend(G,p.id,UI.plan,u.id)).forEach(u=>{ const c=pos.get(u.id); hl.add(Hex.key(c[0],c[1])); });
  if(UI.mode==='scout') Game.unitsOf(G,p.id).filter(u=>Plan.canScout(G,p.id,UI.plan,u.id)).forEach(u=>{ const c=pos.get(u.id); hl.add(Hex.key(c[0],c[1])); });
  if(selU && !UI.mode) Hex.range([selU.q,selU.r],Rules.visionRange(G,selU)).forEach(([q,r])=>{ const k=Hex.key(q,r); if(G.board.tiles.has(k)) vr.add(k); });
  UI.plan.filter(a=>a.type==='move').forEach(a=>{ const u=G.units.find(x=>x.id===a.unitId); if(u&&Rules.isCharge(u)) Plan.chargePath(a.from,a.to).forEach(c=>path.add(Hex.key(c[0],c[1]))); });
  const arrows=UI.plan.filter(a=>a.type==='move').map(a=>[a.from,a.to]);
  const ghosts=[]; pos.forEach((c,id)=>{ const u=Game.unit(G,id); if(u && (u.q!==c[0]||u.r!==c[1])) ghosts.push(c); });

function centerSeen(p){ return CenterZone.keys().every(k=>p.visible.has(k)); }
function centerStatusTag(p){
  const ce=G.centerEffect, c=CenterZone.ctx(G,p.id);
  if(ce.kind==='buff') return c.mine?'<span class="tag" style="color:var(--ok)">내게 적용 중</span>':'<span class="tag">적용 안 됨</span>';
  if(c.other) return '<span class="tag wip">상대가 점령 — 내게 불리</span>';
  return c.mine?'<span class="tag" style="color:var(--ok)">내가 점령 — 상대에게 불리</span>':(centerSeen(p)?'<span class="tag">비어 있음</span>':'<span class="tag">보이지 않음</span>');
}
function centerStatusText(p){
  const ce=G.centerEffect, c=CenterZone.ctx(G,p.id), n=CenterZone.occupiedTiles(G,p.id).length;
  const seen=centerSeen(p);
  let t = c.mine ? `내 기물이 중앙 ${n}칸을 차지하고 있습니다.` : '내 기물이 중앙 칸에 들어가면 ';
  if(!c.mine) t += ce.kind==='buff' ? '효과를 받습니다.' : '상대에게 이 효과가 걸립니다.';
  if(!seen) t+=' 중앙이 시야 밖이라 상대의 점령 여부는 알 수 없습니다.';
  return t;
}
function popHTML(k,title,sub,btns){
  return `<div class="pop" data-pk="${k}" role="dialog" aria-label="${esc(title)}"><div class="t">${esc(title)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}<div class="btns">${btns}</div></div>`;
}
function gameHud(n,full,waiting){

  return `<div class="hud"><b>턴 ${G.turn}</b>${chips.join('')}<span class="spacer"></span>
    ${waiting?'<span class="muted">제출 완료 · 대기 중</span>':`${n?'<button class="btn small" data-act="plan-undo">되돌리기</button>':''}<button class="btn small primary" data-act="plan-submit">제출 ${n}/${CONFIG.actionsPerTurn}</button>`}</div>`;
}
function buildingPop(p,b,waiting,full,cost){
  if(waiting) return '';
  const B=BUILDINGS[b.type], k=Hex.key(b.q,b.r);
  const title=`${B.name} (${k}) · 내구도 ${b.dur}/${b.max}`;
  if(b.done===false) return popHTML(k,title,`공사 중 — 턴 ${b.completeAt}이 끝나면 완공`,'<button class="btn ghost" data-act="deselect">닫기</button>');
  if(!B.summon) return popHTML(k,title,B.desc+(B.income?` 현재 턴당 +${B.income}점.`:''),'<button class="btn ghost" data-act="deselect">닫기</button>');
  if(full) return popHTML(k,title,'행동 3개를 모두 계획했습니다.','<button class="btn primary" data-act="plan-submit">제출</button><button class="btn ghost" data-act="deselect">닫기</button>');
  if(UI.mode==='recruit' && UI.recruitType) return popHTML(k,`${UNITS[UI.recruitType].name} 모집`,'건물 옆의 강조된 칸을 누르면 그 자리에 소환됩니다.','<button class="btn" data-act="recruit-cancel">취소</button>');
  if(!Plan.canRecruitFrom(G,p.id,UI.plan,b.id)) return popHTML(k,title,'이번 턴에는 이 건물에서 이미 모집을 계획했습니다.','<button class="btn ghost" data-act="deselect">닫기</button>');
  const left=p.points-cost, room=Plan.recruitTargets(G,p.id,UI.plan,b.id).length;
  return popHTML(k,title,room?`모집할 기물을 고르세요 · 남은 포인트 ${left}점`:'옆에 빈 칸이 없어 모집할 수 없습니다.',
    Rules.unitsFor(p.civ).map(U=>`<button class="btn" data-act="pick-recruit" data-type="${U.id}" ${U.cost>left||!room?'disabled':''}>✚ ${U.name} ${U.cost}점</button>`).join('')+'<button class="btn ghost" data-act="deselect">닫기</button>');
}
function gamePop(p,selU,k,waiting,full,cost){
  if(waiting || !selU || !k) return '';
  const name=`${UNITS[selU.type].name} (${k}) · 체력 ${selU.hp}/${Rules.maxHp(selU)}`;
  if(full) return popHTML(k,'행동 3개를 모두 계획했습니다','',`<button class="btn primary" data-act="plan-submit">제출</button><button class="btn" data-act="plan-undo">되돌리기</button><button class="btn ghost" data-act="deselect">닫기</button>`);
  if(UI.mode==='build'){ const B=BUILDINGS[UI.buildType]; return popHTML(k,`${B.name} 건설`,'기물 옆의 강조된 칸을 누르세요.',`<button class="btn" data-act="build-cancel">취소</button>`); }
  if(UI.mode) return '';
  const tips=[];
  const site=Game.siteOf(G,selU.id);
  if(site) tips.push(`${BUILDINGS[site.type].name} 공사 중 — 움직이면 취소됩니다 (턴 ${site.completeAt} 끝에 완공)`);
  else if(Plan.movesBuilder(G,UI.plan,selU.id)) tips.push('이번 턴 건설 계획 — 움직이면 취소됩니다');
  if(Rules.isCharge(selU)) tips.push('파란 칸으로 직선 돌격 (길의 상대에게 피해 '+Rules.chargeDamage(G,selU)+')');
  else tips.push('파란 칸: 이동');
  if(Rules.canAttack(selU)) tips.push(`빨간 칸: 공격 (피해 ${Rules.attackDamage(G,selU)})`);
  const left=p.points-cost;
  if(Plan.canPlanBuild(G,p.id,UI.plan,selU.id) && Plan.buildTargets(G,p.id,UI.plan,selU.id,'depot').length) tips.push('옆에 자원 칸이 있습니다 — 보급소를 지을 수 있습니다');
  const up=Plan.upgradeInfo(G,p.id,UI.plan,selU.id);
  const btns=(up?`<button class="btn primary" data-act="pop-upgrade" ${up.affordable?'':'disabled'}>▲ ${UNITS[up.into].name}로 강화 ${up.cost}점</button>`:'')
    +(Plan.canDefend(G,p.id,UI.plan,selU.id)?'<button class="btn" data-act="pop-defend">◈ 방어</button>':'')
    +(Plan.canScout(G,p.id,UI.plan,selU.id)?'<button class="btn" data-act="pop-scout">◉ 정찰</button>':'')
    +(Plan.canPlanBuild(G,p.id,UI.plan,selU.id)?Rules.buildable(p.civ).map(B=>`<button class="btn" data-act="pop-build" data-type="${B.id}" ${B.cost>left||!Plan.buildTargets(G,p.id,UI.plan,selU.id,B.id).length?'disabled':''}>▦ ${B.name} ${B.cost}점</button>`).join(''):'')
    +'<button class="btn ghost" data-act="deselect">닫기</button>';
  return popHTML(k,name,tips.join(' · '),btns);
}
function placePop(){
  const pop=$app.querySelector('.pop'); if(!pop) return;
  const svg=$app.querySelector('svg.board'), wrap=pop.parentElement; if(!svg||!svg.getScreenCTM) return;
  const m=svg.getScreenCTM(); if(!m) return;
  const [q,r]=Hex.parse(pop.dataset.pk), [x,y]=Hex.toPixel(q,r,SIZE);
  const pt=svg.createSVGPoint(); pt.x=x; pt.y=y;
  const sp=pt.matrixTransform(m), wr=wrap.getBoundingClientRect();
  const w=pop.offsetWidth, h=pop.offsetHeight, gap=SIZE*m.a*0.9+6;
  const cx=sp.x-wr.left, cy=sp.y-wr.top;
  let top=cy-gap-h; if(top<4) top=cy+gap;
  pop.style.left=Math.max(4,Math.min(wr.width-w-4,cx-w/2))+'px';
  pop.style.top=Math.min(top,wr.height-h-4)+'px';
  pop.style.visibility='visible';
}

  const manual=`
    <div class="two">
      <div class="box"><h3 style="margin-top:0">게임 만들기</h3>
        <p class="small muted">이 기기가 호스트가 됩니다. 대기실에서 참가자마다 초대 코드를 만들어 보내세요.</p>

        <button class="btn" data-act="net-answer" ${UI.netBusy||!UI.offerInput?'disabled':''}>응답 코드 만들기</button>

        ${UI.answerCode?'<p class="small">호스트가 응답 코드를 붙여넣으면 자동으로 연결됩니다. 이 화면을 열어 두세요.</p>':''}</div>
    </div>
    <p class="small muted">서버 없이 연결합니다. 코드는 카카오톡 등으로 복사해서 주고받으면 됩니다. 일부 공유기나 학교·회사 와이파이는 기기끼리 통신을 막아 연결이 안 될 수 있습니다.</p>`;
  return `${topbar()}<div class="page"><div class="page-head"><div><h2>온라인 게임</h2><div class="muted">각자 자기 기기로 함께 플레이합니다.</div></div><button class="btn" data-act="go" data-to="menu">돌아가기</button></div>
    <div class="field"><label for="nn">내 이름</label><input id="nn" data-field="netName" value="${esc(UI.netName)}" maxlength="12" placeholder="예: 백관"></div>
    <div style="display:flex;gap:6px;margin:6px 0 14px" role="tablist">
      <button class="btn ${tab==='room'?'active':''}" data-act="online-tab" data-tab="room" role="tab" aria-selected="${tab==='room'}">방 코드로 연결</button>
      <button class="btn ${tab==='manual'?'active':''}" data-act="online-tab" data-tab="manual" role="tab" aria-selected="${tab==='manual'}">코드 직접 교환 (서버 없음)</button>
    </div>
    ${tab==='room'?room:manual}
    ${Net.error?`<p class="hint warn">${esc(Net.error)}</p>`:''}
  </div>`;
}

function viewLobby(){
  const m=Net.main;
  if(!m) return `${topbar()}<div class="page"><div class="box">호스트와 연결하는 중입니다…</div>${onlineBanner()}</div>`;
  const seated=Net.mySeat>=0, conn=m.conn||[];
  const seats=m.seats.map((s,i)=>`<div class="seat"><span class="dot" style="background:${PLAYER_COLORS[i]};width:16px;height:16px"></span>
    <span>${s.type==='human'?`<b>${esc(s.name)}</b>${s.uid===Net.clientId?' <span class="tag">나</span>':''}${i===0?' <span class="tag">호스트</span>':''}${conn[i]===false?' <span class="tag wip">연결 끊김</span>':''}`:(s.type==='ai'?'컴퓨터':s.type==='none'?'<span class="muted">없음 — 이 자리는 비워 둠</span>':'<span class="muted">빈 자리 — 참가를 기다리는 중</span>')}</span>
    ${Net.isHost&&i>0&&m.phase==='lobby'?(s.type==='human'?`<button class="btn small ghost danger" data-act="net-kick" data-seat="${i}">내보내기</button>`:`<select data-seat-net="${i}" aria-label="${i+1}번 자리"><option value="open" ${s.type==='open'?'selected':''}>빈 자리</option><option value="ai" ${s.type==='ai'?'selected':''}>컴퓨터</option><option value="none" ${s.type==='none'?'selected':''}>없음</option></select>`):'<span></span>'}</div>`).join('');
  return `${topbar()}<div class="page">
    <div class="page-head"><div><h2>대기실</h2><div class="muted">${m.mode==='room'?'다른 기기에서 이 페이지를 열고 온라인 게임 → 방 코드로 연결에 아래 코드를 입력하세요.':'참가자마다 아래에서 초대 코드를 만들어 보내세요.'}</div></div></div>
    ${onlineBanner()}
    ${m.mode==='room'?`<div class="box" style="text-align:center;margin-top:10px"><div class="muted small">방 코드</div><div class="code">${esc(m.code)}</div></div>`:''}
    ${Net.isHost&&m.mode==='manual'?invitePanel(false):''}
    <h3>자리</h3><div class="box">${seats}</div>
    ${m.phase!=='lobby'&&!seated?'<div class="banner err" style="margin-top:12px">게임이 이미 시작되어 자리를 받지 못했습니다.</div>':''}
    ${m.phase==='lobby'&&!seated?'<div class="banner" style="margin-top:12px">호스트 기기에 연결되었습니다. 자리가 배정되면 표시됩니다. 자리가 모두 찼다면 배정되지 않습니다.</div>':''}
    ${Net.isHost&&m.phase==='lobby'?`<div class="field" style="max-width:280px;margin-top:14px"><label for="ail">컴퓨터 난이도</label>${aiLevelSelect('ai-level-net',m.aiLevel||'normal')}</div>`:(m.seats.some(s=>s.type==='ai')?`<p class="small muted">컴퓨터 난이도: ${AI_LEVELS[m.aiLevel||'normal']}</p>`:'')}
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${Net.isHost&&m.phase==='lobby'?`<button class="btn primary" data-act="net-start" data-fill="0">시작 (빈 자리는 비워 둠)</button><button class="btn" data-act="net-start" data-fill="1">시작 (빈 자리는 컴퓨터로)</button>`:(seated&&m.phase==='lobby'?'<div class="banner">호스트가 게임을 시작하기를 기다리는 중입니다.</div>':'')}</div>
  </div>`;
}

function viewOverlay(){
  const o=UI.overlay; if(!o) return '';
  return `<div class="overlay ${o.opaque?'opaque':''}" role="dialog" aria-modal="true"><div class="ov-card"><h3>${esc(o.title)}</h3><div>${o.body||''}</div><button class="btn primary" data-act="overlay-close">${esc(o.btn||'확인')}</button></div></div>`;
}

function render(){
  let html='';
  const hide = UI.overlay && UI.overlay.opaque;
  if(!hide){
    switch(UI.screen){
      case 'menu': html=viewMenu(); break;
      case 'settings': html=viewSettings(); break;
      case 'rules': html=viewRules(); break;
      case 'online': html=viewOnline(); break;
      case 'lobby': html=viewLobby(); break;
      case 'civ': html=viewCiv(); break;
      case 'placement': html=viewPlacement(); break;
      case 'game': html=viewGame(); break;
    }
  }
  // 입력 중인 칸의 포커스를 유지
  const ae=document.activeElement, focusField=ae&&ae.dataset?ae.dataset.field:null;
  $app.innerHTML = html + viewOverlay();
  if(focusField){ const el=$app.querySelector(`[data-field="${focusField}"]`); if(el && !el.readOnly){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } }
  placePop();
}
window.addEventListener('resize',()=>placePop());

/* 입력 처리 */
async function netAction(fn){
  if(UI.netBusy) return; UI.netBusy=true; Net.error=''; render();
  try{ await fn(); }catch(e){ Net.error=(e&&e.message)||'연결 오류가 났습니다.'; }
  UI.netBusy=false; render();
}
const Handlers = {
  go(d){
    if(d.to==='start'){ if(!SETUP.seats.some(s=>s.type==='human') || SETUP.seats.filter(s=>s.type!=='none').length<2){ UI.screen='settings'; return render(); } return Flow.newGame(); }
    if(d.to==='online') Net.error='';
    UI.screen=d.to; render();
  },
  quit(){
    const inGame = !['settings','rules','online','menu'].includes(UI.screen);
    const msg = UI.online ? (Net.isHost?'호스트가 나가면 모두의 게임이 멈춥니다. 메인 화면의 다시 열기로 이어서 할 수 있습니다. 나갈까요?':'게임에서 나갈까요? 다시 참가하면 원래 자리로 돌아옵니다.') : '진행 중인 게임을 끝내고 메인으로 돌아갈까요?';
    if(!inGame || confirm(msg)){
      if(UI.online || Net.mode) Net.leave();
      Object.assign(UI,{online:false,lastTurn:null,submittedLocal:null,inviteCode:'',answerInput:'',offerInput:'',answerCode:'',screen:'menu',overlay:null});
      G=null; render();
    }
  },
  'online-tab'(d){ UI.onlineTab=d.tab; Net.error=''; render(); },
  'net-host-room'(){ netAction(async()=>{ UI.lastTurn=null; await Net.hostRoom(UI.netName.trim()||'호스트'); }); },
  'net-join-room'(){ netAction(async()=>{ UI.lastTurn=null; await Net.joinRoom(UI.netCode,UI.netName.trim()||'플레이어'); }); },
  'net-rejoin'(){ const code=Net.code, name=Net.name; netAction(async()=>{ Net.leave(); await Net.joinRoom(code,name); }); },
  'net-host-manual'(){ UI.lastTurn=null; Net.hostManual(UI.netName.trim()||'호스트'); },
  'net-invite'(){ netAction(async()=>{ UI.answerInput=''; await Net.createInvite(); }); },
  'net-accept'(){ netAction(async()=>{ await Net.acceptAnswer(UI.answerInput); }); },
  'net-answer'(){ netAction(async()=>{ UI.lastTurn=null; await Net.answerInvite(UI.offerInput,UI.netName.trim()||'플레이어'); }); },
  'net-resume'(){ netAction(async()=>{ UI.lastTurn=null; try{ await Net.resumeHost(); }catch(e){ Net.leave(); throw e; } }); },
  'net-start'(d){ Net.error=''; Net.hostStart(!!d && d.fill==='1'); },
  'net-kick'(d){ Net.hostKick(Number(d.seat)); },
  'net-replace'(d){ if(confirm('이 자리를 남은 게임 동안 컴퓨터가 맡게 할까요?')) Net.hostReplaceWithAI(Number(d.seat)); },
  async copy(d){
    const v=UI[d.field]||'';
    try{ await navigator.clipboard.writeText(v); }catch(e){ const el=$app.querySelector(`[data-field="${d.field}"]`); if(el){ el.select(); try{ document.execCommand('copy'); }catch(x){} } }
    UI.copied=d.field; render(); setTimeout(()=>{ UI.copied=''; render(); },1500);
  },
  'overlay-close'(){ const cb=UI.overlay&&UI.overlay.onClose; UI.overlay=null; cb?cb():render(); },
  'civ-pick'(d){ if(isWaiting()) return; UI.selCiv=d.id; render(); },
  'civ-confirm'(){
    if(!UI.selCiv) return;
    if(UI.online){ if(isWaiting()) return; UI.submittedLocal={phase:'civ',turn:G.turn}; Net.submit({civ:UI.selCiv}); render(); return; }
    G.players[UI.viewer].civ=UI.selCiv; Flow.nextCiv();
  },
  buy(d){ if(isWaiting()) return; UI.pop=null; const p=G.players[UI.viewer]; if(Purchase.buy(p,d.type)){ UI.selReserve=d.type; UI.selUnit=null; setHint(`${UNITS[d.type].name}을(를) 구매했습니다. 시작 영역의 빈 칸을 눌러 배치하세요.`); } render(); },
  'sel-reserve'(d){ if(isWaiting()) return; UI.selReserve = UI.selReserve===d.type?null:d.type; UI.selUnit=null; setHint(UI.selReserve?`${UNITS[d.type].name}을(를) 놓을 칸을 누르세요.`:''); render(); },
  'sell-reserve'(d){ if(isWaiting()) return; const p=G.players[UI.viewer]; Purchase.sellReserve(p,d.type); if(!p.reserve[d.type]&&UI.selReserve===d.type) UI.selReserve=null; render(); },
  'auto-place'(){ if(isWaiting()) return; Purchase.autoPlace(G,UI.viewer); UI.selHQ=false; UI.selReserve=null; setHint('남은 기물을 무작위로 배치했습니다. 기물을 눌러 옮길 수 있습니다.'); render(); },
  unplace(){ if(isWaiting()) return; const u=Game.unit(G,UI.selUnit); if(u){ Purchase.unplace(G,u); UI.selUnit=null; } render(); },
  'sell-unit'(){ if(isWaiting()) return; const u=Game.unit(G,UI.selUnit); if(u){ Purchase.sellUnit(G,u); UI.selUnit=null; } render(); },
  'pick-recruit'(d){ if(UI.selBld==null) return; UI.recruitType=d.type; UI.mode='recruit'; setHint('건물 옆의 강조된 칸을 누르세요.'); render(); },
  'recruit-cancel'(){ UI.mode=null; UI.recruitType=null; setHint(''); render(); },
  deselect(){ UI.selBld=null; UI.recruitType=null; if(UI.mode==='recruit') UI.mode=null; UI.selUnit=null; UI.selHQ=false; UI.pop=null; if(UI.mode==='build') UI.mode=null; render(); },
  'pop-close'(){ UI.pop=null; render(); },
  'quick-hq'(){ if(isWaiting()||!UI.pop) return; if(Purchase.placeHQ(G,UI.viewer,UI.pop.k)) setHint('본진을 놓았습니다. 누르면 옮길 수 있습니다.'); UI.pop=null; render(); },
  'pop-upgrade'(){
    if(UI.selUnit==null || UI.plan.length>=CONFIG.actionsPerTurn) return;
    const i=Plan.upgradeInfo(G,UI.viewer,UI.plan,UI.selUnit); if(!i || !i.affordable){ setHint('포인트가 부족하거나 강화할 수 없는 기물입니다.',true); return render(); }
    UI.plan.push({type:'upgrade',unitId:UI.selUnit,into:i.into}); setHint(`${UNITS[i.into].name}로 강화를 계획했습니다.`); render();
  },
  'pop-defend'(){ if(UI.selUnit==null || UI.plan.length>=CONFIG.actionsPerTurn || !Plan.canDefend(G,UI.viewer,UI.plan,UI.selUnit)) return;
    UI.plan.push({type:'defend',unitId:UI.selUnit}); setHint('방어를 계획했습니다. 이 기물은 이번 턴 피해를 받지 않고, 같은 슬롯의 공격은 되돌립니다.'); render(); },
  'quick-place'(d){
    if(isWaiting() || !UI.pop) return;
    const p=G.players[UI.viewer], k=UI.pop.k;
    if(!p.reserve[d.type] && !Purchase.buy(p,d.type)){ setHint('포인트가 부족합니다.',true); return render(); }
    if(Purchase.place(G,UI.viewer,d.type,k)) setHint(`${UNITS[d.type].name}을(를) 배치했습니다.`);
    UI.pop=null; render();
  },
  'pop-scout'(){ if(UI.selUnit!=null) tryScout(UI.selUnit); },
  'pop-build'(d){ if(UI.selUnit==null) return; UI.buildType=d.type; UI.mode='build'; setHint('기물 옆의 강조된 칸을 누르세요.'); render(); },
  'build-cancel'(){ UI.mode=null; setHint(''); render(); },
  'place-done'(){
    const p=G.players[UI.viewer], hq=Purchase.hqOf(G,p.id); if(Purchase.reserveCount(p)||!Game.unitsOf(G,p.id).length||!hq) return;
    if(UI.online){ if(isWaiting()) return; UI.submittedLocal={phase:'placement',turn:G.turn}; UI.selUnit=null; UI.selReserve=null; UI.selHQ=false;
      Net.submit({placement:{units:Game.unitsOf(G,p.id).map(u=>({type:u.type,q:u.q,r:u.r})),hq:{q:hq.q,r:hq.r}}}); setHint('배치를 제출했습니다.'); render(); return; }
    Flow.nextPlacement();
  },
  mode(d){
    if(!ACTIONS[d.type].implemented || UI.plan.length>=CONFIG.actionsPerTurn) return;
    UI.mode = UI.mode===d.type ? null : d.type;
    if(UI.mode==='move') setHint(UI.selUnit!=null?'이동할 칸을 누르세요. 기병은 직선 3칸까지 돌격합니다.':'이동할 기물을 누르세요.');
    else if(UI.mode==='attack'){ setHint(UI.selUnit!=null?'빨간 칸의 상대를 누르세요.':'공격할 기물을 누르세요. 기병과 기술병은 공격할 수 없습니다.'); }
    else if(UI.mode==='defend'){ UI.selUnit=null; setHint('방어할 기물을 누르세요.'); }
    else if(UI.mode==='recruit'){ UI.selUnit=null; UI.recruitType=null; setHint('본진이나 병영을 누르고 모집할 기물을 고르세요.'); }
    else if(UI.mode==='upgrade'){ UI.selUnit=null; setHint('완공된 문명 전용 건물 바로 옆의 보병을 누르세요.'); }
    else if(UI.mode==='scout'){ UI.selUnit=null; setHint('정찰할 기물을 누르세요. 기물이 그 시점에 서 있는 자리를 기준으로 정찰합니다.'); }
    else if(UI.mode==='build'){
      const p=G.players[UI.viewer], left=p.points-Plan.plannedCost(UI.plan);
      const list=Rules.buildable(p.civ);
      if(!list.some(B=>B.cost<=left)){ UI.mode=null; setHint('건설할 포인트가 부족합니다.',true); }
      else { if(!list.includes(BUILDINGS[UI.buildType]) || BUILDINGS[UI.buildType].cost>left) UI.buildType=list.find(B=>B.cost<=left).id;
        setHint('건물을 고르고, 건설할 기술병을 누른 뒤 옆의 강조된 칸을 누르세요. 공사 중인 기술병은 고를 수 없습니다.'); }
    }
    else setHint('');
    render();
  },
  'build-type'(d){ UI.buildType=d.type; render(); },
  'sel-unit'(d){
    const id=Number(d.id);
    if(UI.mode==='scout') return tryScout(id);
    UI.selUnit = UI.selUnit===id && !UI.mode ? null : id;
    if(UI.mode==='move') setHint('이동할 칸을 누르세요.');
    if(UI.mode==='build') setHint('기물 옆의 강조된 칸을 누르세요.');
    render();
  },
  'plan-undo'(){ UI.plan.pop(); setHint('마지막 행동을 취소했습니다.'); render(); },
  'plan-clear'(){ UI.plan=[]; UI.mode=null; setHint('계획을 모두 지웠습니다.'); render(); },
  'plan-submit'(){
    UI.mode=null; UI.selUnit=null;
    if(UI.online){ if(isWaiting()) return; UI.submittedLocal={phase:'game',turn:G.turn}; Net.submit({plan:{turn:G.turn,actions:UI.plan.slice()}}); render(); return; }
    Flow.submit();
  }
};

function tryScout(id){
  if(Plan.canScout(G,UI.viewer,UI.plan,id)){
    if(UI.plan.length>=CONFIG.actionsPerTurn){ setHint('행동 3개를 모두 계획했습니다.',true); return render(); }
    UI.plan.push({type:'scout',unitId:id,at:Plan.positions(G,UI.viewer,UI.plan).get(id)}); UI.mode=null; UI.selUnit=id;
    setHint(`정찰을 계획했습니다. 처리되면 그 자리 주변 ${CONFIG.scoutVision}칸이 다음 턴까지 보입니다.`);
  } else setHint('이번 턴에 이미 정찰을 계획한 기물입니다.',true);
  render();
}

function onTile(k){
  if(UI.overlay) return;
  if(UI.screen==='placement') return onPlacementTile(k);
  if(UI.screen==='game') return onGameTile(k);
}
function onPlacementTile(k){
  if(isWaiting()) return;
  const pid=UI.viewer, t=G.board.tiles.get(k), occ=Game.unitAt(G,k), bd=Game.buildingAt(G,k);
  if(bd && bd.owner===pid && bd.type==='hq'){ UI.pop=null; UI.selUnit=null; UI.selReserve=null; UI.selHQ=!UI.selHQ; return render(); }
  if(UI.selHQ){ if(t.zoneOwner===pid && Purchase.placeHQ(G,pid,k)) setHint('본진을 옮겼습니다.'); UI.selHQ=false; return render(); }
  if(occ && occ.owner===pid){ UI.pop=null; UI.selUnit = UI.selUnit===occ.id?null:occ.id; UI.selReserve=null; setHint(UI.selUnit?'옮길 칸을 누르거나 아래에서 판매·회수하세요.':''); return render(); }
  if(t.zoneOwner!==pid){ UI.pop=null; UI.selUnit=null; setHint('자신의 시작 영역 안에만 배치할 수 있습니다.',true); return render(); }
  if(occ || bd){ UI.pop=null; return render(); }
  if(UI.selReserve){
    Purchase.place(G,pid,UI.selReserve,k);
    if(!G.players[pid].reserve[UI.selReserve]) UI.selReserve=null;
    setHint(UI.selReserve?'계속 배치할 칸을 누르세요.':'배치했습니다.');
  } else if(UI.selUnit!=null){
    const u=Game.unit(G,UI.selUnit); if(u && Purchase.relocate(G,u,k)) setHint('기물을 옮겼습니다.');
    UI.selUnit=null;
  } else { UI.pop = UI.pop&&UI.pop.k===k ? null : {k}; setHint(''); }
  render();
}
function onGameTile(k){
  const pid=UI.viewer, waiting=isWaiting(), pos=Plan.positions(G,pid,waiting?[]:UI.plan);
  let own=null; pos.forEach((c,id)=>{ if(Hex.key(c[0],c[1])===k) own=id; });
  if(waiting){ UI.selUnit=own; return render(); }
  const bd=Game.buildingAt(G,k), myB=bd&&bd.owner===pid?bd:null;
  if(UI.mode==='recruit'){
    if(UI.selBld!=null && UI.recruitType && Plan.recruitTargets(G,pid,UI.plan,UI.selBld).includes(k)){
      const U=UNITS[UI.recruitType];
      if(U.cost>G.players[pid].points-Plan.plannedCost(UI.plan)){ setHint('포인트가 부족합니다.',true); return render(); }
      UI.plan.push({type:'recruit',buildingId:UI.selBld,unit:U.id,at:Hex.parse(k)});
      UI.mode=null; UI.recruitType=null; setHint(`${U.name} 모집을 계획했습니다.`); return render();
    }
    if(myB){ UI.selBld=myB.id; UI.selUnit=null; UI.recruitType=null; setHint('모집할 기물을 고르세요.'); return render(); }
    setHint('강조된 칸만 고를 수 있습니다.',true); return render();
  }
  if(myB && !UI.mode){ UI.selBld = UI.selBld===myB.id ? null : myB.id; UI.selUnit=null; return render(); }
  if(UI.selBld!=null && !UI.mode){ UI.selBld=null; }
  if(UI.mode==='defend'){ if(own!=null){ UI.selUnit=own; UI.mode=null; return Handlers['pop-defend'](); } setHint('자신의 기물을 눌러야 합니다.',true); return render(); }
  if(UI.mode==='upgrade'){ if(own!=null && Plan.upgradeInfo(G,pid,UI.plan,own)){ UI.selUnit=own; UI.mode=null; return Handlers['pop-upgrade'](); } setHint('강조된 보병만 강화할 수 있습니다.',true); return render(); }
  if(UI.mode==='scout'){ if(own!=null) return tryScout(own); setHint('자신의 기물을 눌러야 합니다.',true); return render(); }
  if(UI.mode==='move' || UI.mode==='build'){
    const targets = UI.selUnit==null ? [] : (UI.mode==='move' ? Plan.moveTargets(G,pid,UI.plan,UI.selUnit) : Plan.buildTargets(G,pid,UI.plan,UI.selUnit,UI.buildType));
    if(own!=null && !targets.includes(k)){ UI.selUnit=own; setHint(UI.mode==='move'?'이동할 칸을 누르세요.':'기물 옆의 강조된 칸을 누르세요.'); return render(); }
    if(UI.selUnit==null){ setHint('먼저 자신의 기물을 누르세요.',true); return render(); }
    if(!targets.includes(k)){ setHint('강조된 칸만 고를 수 있습니다.',true); return render(); }
    if(UI.mode==='move') UI.plan.push({type:'move',unitId:UI.selUnit,from:pos.get(UI.selUnit),to:Hex.parse(k)});
    else {
      const B=BUILDINGS[UI.buildType], left=G.players[pid].points-Plan.plannedCost(UI.plan);
      if(B.cost>left){ setHint('포인트가 부족합니다.',true); return render(); }
      UI.plan.push({type:'build',unitId:UI.selUnit,building:B.id,at:Hex.parse(k),from:pos.get(UI.selUnit)});
      UI.mode=null;
    }
    if(UI.plan.length>=CONFIG.actionsPerTurn){ UI.mode=null; setHint('행동 3개를 모두 계획했습니다. 제출하세요.'); }
    else setHint(UI.mode==='move'?'이동을 계획했습니다. 같은 기물을 계속 움직이거나 다른 기물을 고르세요.':'건설을 계획했습니다.');
    return render();
  }
  if(UI.mode==='attack'){
    if(UI.selUnit!=null && Plan.attackTargets(G,pid,UI.plan,UI.selUnit).includes(k)){ planAttack(k); UI.mode=null; return render(); }
    if(own!=null){ UI.selUnit=own; setHint('빨간 칸의 상대를 누르세요.'); return render(); }
    setHint('빨간 칸의 상대만 공격할 수 있습니다.',true); return render();
  }
  // 기본: 기물을 누르면 선택, 강조된 칸을 누르면 바로 공격·이동
  if(own!=null){ UI.selUnit = UI.selUnit===own ? null : own; setHint(UI.selUnit!=null?'파란 칸은 이동, 빨간 칸은 공격입니다. 정찰과 건설은 기물 위 메뉴에서 고르세요.':''); return render(); }
  if(UI.selUnit!=null){
    if(UI.plan.length>=CONFIG.actionsPerTurn){ setHint('행동 3개를 모두 계획했습니다. 제출하거나 되돌리세요.',true); return render(); }
    if(Plan.attackTargets(G,pid,UI.plan,UI.selUnit).includes(k)){ planAttack(k); return render(); }
    if(Plan.moveTargets(G,pid,UI.plan,UI.selUnit).includes(k)){
      UI.plan.push({type:'move',unitId:UI.selUnit,from:pos.get(UI.selUnit),to:Hex.parse(k)});
      setHint(UI.plan.length>=CONFIG.actionsPerTurn?'행동 3개를 모두 계획했습니다. 제출하세요.':'이동을 계획했습니다. 이어서 같은 기물로 행동하거나 다른 기물을 누르세요.');
      return render();
    }
  }
  UI.selUnit=null; setHint('기물을 누르면 이동(파란 칸)과 공격(빨간 칸)할 수 있는 곳이 표시됩니다.');
  render();
}
function planAttack(k){
  const pid=UI.viewer, pos=Plan.positions(G,pid,UI.plan), tg=Plan.attackTargetAt(G,pid,k);
  if(!tg) return;
  UI.plan.push({type:'attack',unitId:UI.selUnit,target:tg,at:Hex.parse(k),from:pos.get(UI.selUnit)});
  setHint(UI.plan.length>=CONFIG.actionsPerTurn?'행동 3개를 모두 계획했습니다. 제출하세요.':'공격을 계획했습니다.');
}

$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){ if(el.disabled) return; const h=Handlers[el.dataset.act]; if(h) h(el.dataset,el); return; }
  const t=e.target.closest('[data-k]'); if(t) onTile(t.dataset.k);
});
$app.addEventListener('change',e=>{
  const n=e.target.dataset.seatName, ty=e.target.dataset.seatType;
  if(n!=null) SETUP.seats[n].name=e.target.value;
  if(ty!=null){ SETUP.seats[ty].type=e.target.value; render(); }
  const sn=e.target.dataset.seatNet; if(sn!=null) Net.hostSetSeat(Number(sn),e.target.value);
  if(e.target.dataset.aiLevelLocal){ SETUP.aiLevel=e.target.value; }
  if(e.target.dataset.aiLevelNet){ Net.hostSetAILevel(e.target.value); }
});
$app.addEventListener('input',e=>{
  const n=e.target.dataset.seatName; if(n!=null) SETUP.seats[n].name=e.target.value;
  const f=e.target.dataset.field;
  if(f && !e.target.readOnly){ UI[f]=e.target.value; if(f==='offerInput'){ const b=$app.querySelector('[data-act="net-answer"]'); if(b) b.disabled=!e.target.value||UI.netBusy; } }
});
window.addEventListener('beforeunload',e=>{ if(UI.online && Net.isHost && Net.hostMain && Net.hostMain.phase!=='lobby'){ e.preventDefault(); e.returnValue=''; } });

Net.init();
render();
</script>
</body>
</html>
